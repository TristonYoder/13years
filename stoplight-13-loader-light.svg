<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="top-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <style>
      @keyframes rotate-red {
        0% { transform: translateY(0px); }
        16% { transform: translateY(50px); }
        33% { transform: translateY(100px); }
        41% { transform: translateY(50px) translateX(-30px); }
        50% { transform: translateY(0px); }
        66% { transform: translateY(50px); }
        83% { transform: translateY(100px); }
        91% { transform: translateY(50px) translateX(30px); }
        100% { transform: translateY(0px); }
      }
      @keyframes glow-red {
        0%, 32.99% { opacity: 0; }
        33%, 49.99% { opacity: 1; }
        50%, 82.99% { opacity: 0; }
        83%, 99.99% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes rotate-yellow {
        0% { transform: translateY(0px); }
        16% { transform: translateY(50px); }
        24% { transform: translateY(-25px) translateX(-30px); }
        33% { transform: translateY(-50px); }
        50% { transform: translateY(0px); }
        66% { transform: translateY(50px); }
        74% { transform: translateY(-25px) translateX(30px); }
        83% { transform: translateY(-50px); }
        100% { transform: translateY(0px); }
      }
      @keyframes glow-yellow {
        0%, 15.99% { opacity: 0; }
        16%, 32.99% { opacity: 1; }
        33%, 65.99% { opacity: 0; }
        66%, 82.99% { opacity: 1; }
        83%, 100% { opacity: 0; }
      }
      @keyframes rotate-green {
        0% { transform: translateY(0px); }
        8% { transform: translateY(-50px) translateX(-30px); }
        16% { transform: translateY(-100px); }
        33% { transform: translateY(-50px); }
        50% { transform: translateY(0px); }
        58% { transform: translateY(-50px) translateX(30px); }
        66% { transform: translateY(-100px); }
        83% { transform: translateY(-50px); }
        100% { transform: translateY(0px); }
      }
      @keyframes glow-green {
        0%, 15.99% { opacity: 1; }
        16%, 49.99% { opacity: 0; }
        50%, 65.99% { opacity: 1; }
        66%, 100% { opacity: 0; }
      }
      .cycle-red { animation: rotate-red 6s ease-in-out infinite; }
      .cycle-yellow { animation: rotate-yellow 6s ease-in-out infinite; }
      .cycle-green { animation: rotate-green 6s ease-in-out infinite; }
      .glow-red { animation: rotate-red 6s ease-in-out infinite, glow-red 6s ease-in-out infinite; fill: #DC143C; }
      .glow-yellow { animation: rotate-yellow 6s ease-in-out infinite, glow-yellow 6s ease-in-out infinite; fill: #FFD700; }
      .glow-green { animation: rotate-green 6s ease-in-out infinite, glow-green 6s ease-in-out infinite; fill: #228B22; }
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .stoplight-13-number {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
      }
      .num-1 {
        font-size: 240px;
        fill: #333333;
        letter-spacing: -0.1em;
        transform: scaleX(1.6);
        transform-origin: 0 0;
      }
      .num-3 {
        font-size: 220px;
        fill: #333333;
        stroke: #333333;
        stroke-width: 12;
        letter-spacing: -0.12em;
        font-stretch: condensed;
      }
    </style>
  </defs>

  <!-- Fat wide "3" (background) -->
  <text x="90" y="122" dominant-baseline="middle" class="stoplight-13-number num-3">3</text>

  <!-- Solid stoplight housing (the "I") -->
  <rect x="20" y="15" width="60" height="170" fill="#333333"/>

  <!-- Animated stoplight circles -->
  <circle cx="50" cy="50" r="18" fill="#DC143C" class="cycle-red"/>
  <circle cx="50" cy="100" r="18" fill="#FFD700" class="cycle-yellow"/>
  <circle cx="50" cy="150" r="18" fill="#228B22" class="cycle-green"/>

  <!-- Floating circles (appear on top during upward transitions) -->
  <circle cx="50" cy="50" r="18" class="glow-red"/>
  <circle cx="50" cy="100" r="18" class="glow-yellow"/>
  <circle cx="50" cy="150" r="18" class="glow-green"/>
</svg>