<!doctype html>
<html lang="en" data-cue="OFF" data-layout="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>13 Years Pager</title>
<style>
  :root {
    --cue-off-bg: #141a26;
    --cue-off-fg: #ffffff;
    --cue-standby-bg: #f5b826;
    --cue-standby-fg: #1a1a1a;
    --cue-go-bg: #26c759;
    --cue-go-fg: #ffffff;

    --s: min(1.2vh, 2.2vw);

    --bg: var(--cue-off-bg);
    --fg: var(--cue-off-fg);
  }

  [data-cue="STANDBY"], [data-cue="FLASH_STANDBY"] {
    --bg: var(--cue-standby-bg);
    --fg: var(--cue-standby-fg);
  }
  [data-cue="GO"], [data-cue="FLASH_GO"] {
    --bg: var(--cue-go-bg);
    --fg: var(--cue-go-fg);
  }

  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Medium.ttf") format("truetype");
    font-weight: 500; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 600; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Bold.ttf") format("truetype");
    font-weight: 700; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-ExtraBold.ttf") format("truetype");
    font-weight: 800; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Black.ttf") format("truetype");
    font-weight: 900; font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-feature-settings: "zero" 1;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; }

  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .hidden { display: none !important; }

  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "zero" 1; }

  #standard {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: calc(2 * var(--s));
    padding: calc(2 * var(--s)) calc(2.5 * var(--s));
    min-height: 0;
    width: min(100%, calc(80 * var(--s)));
    margin: 0 auto;
  }

  .rolebar {
    display: flex;
    align-items: center;
    gap: calc(1.5 * var(--s));
    flex: 0 0 auto;
  }

  .rolepick {
    position: relative;
    display: inline-flex;
    align-items: center;
    max-width: 60%;
    font-size: calc(1.8 * var(--s));
  }

  .rolepick::after {
    content: "";
    position: absolute;
    right: calc(1.2 * var(--s));
    width: 0.4em;
    height: 0.4em;
    border-right: 0.12em solid currentColor;
    border-bottom: 0.12em solid currentColor;
    transform: translateY(-25%) rotate(45deg);
    pointer-events: none;
    opacity: 0.75;
  }

  .rolepick.single::after { display: none; }

  #role {
    font: inherit;
    font-size: 1em;
    font-weight: 700;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.22);
    border: 0;
    border-radius: calc(0.9 * var(--s));
    padding: calc(0.7 * var(--s)) calc(3.2 * var(--s)) calc(0.7 * var(--s)) calc(1.4 * var(--s));
    max-width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  #role:disabled { opacity: 1; }
  #role option { color: #111; background: #fff; }

  .link {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: calc(0.6 * var(--s));
    font-size: calc(1.35 * var(--s));
    font-weight: 600;
    opacity: 0.8;
  }
  .dot {
    width: calc(1 * var(--s));
    height: calc(1 * var(--s));
    border-radius: 50%;
    background: #ff3b30;
  }
  .link[data-live="1"] .dot { background: #30d158; }

  .stage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(1.4 * var(--s));
    min-height: 0;
  }

  #cueWord {
    font-size: min(calc(9 * var(--s)), 17vw);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-align: center;
  }

  #person {
    font-size: calc(2 * var(--s));
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.8;
  }

  #itemCard {
    flex: 0 0 auto;
    align-self: center;
    text-align: center;
    background: rgba(0, 0, 0, 0.25);
    border-radius: calc(2 * var(--s));
    padding: calc(2 * var(--s)) calc(3 * var(--s));
    max-width: 100%;
  }

  #itemTitle {
    font-size: calc(2 * var(--s));
    font-weight: 700;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #itemCard[data-header="1"] #itemTitle { font-size: calc(2.8 * var(--s)); }

  #countdown {
    font-size: calc(6.8 * var(--s));
    font-weight: 900;
    line-height: 1.05;
    margin-top: calc(0.6 * var(--s));
  }

  #duration {
    font-size: calc(1.35 * var(--s));
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.6;
  }

  #notes {
    flex: 0 1 auto;
    display: flex;
    flex-direction: column;
    gap: calc(1.2 * var(--s));
    overflow: hidden;
  }

  .note {
    background: rgba(0, 0, 0, 0.18);
    border-radius: calc(1.5 * var(--s));
    padding: calc(1.2 * var(--s)) calc(2 * var(--s));
  }
  .note[data-current="1"] { background: rgba(0, 0, 0, 0.3); }

  .note-label {
    font-size: calc(1.35 * var(--s));
    font-weight: 900;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }
  .note-text {
    font-size: calc(1.85 * var(--s));
    font-weight: 500;
    margin-top: calc(0.4 * var(--s));
  }
  .note[data-current="1"] .note-text { font-size: calc(2.2 * var(--s)); font-weight: 700; }

  #banner {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: calc(1.2 * var(--s));
    background: #ffd60a;
    color: #000;
    border-radius: calc(1.5 * var(--s));
    padding: calc(1.4 * var(--s)) calc(2 * var(--s));
    font-size: calc(2.2 * var(--s));
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 calc(0.3 * var(--s)) calc(1 * var(--s)) rgba(0, 0, 0, 0.35);
  }
  #banner::before { content: "💬"; font-size: calc(2 * var(--s)); }

  #notifyBar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: calc(1 * var(--s));
  }

  #notifyBar button, #chatHead button, #compose button {
    font: inherit;
    font-size: calc(1.5 * var(--s));
    font-weight: 700;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.3);
    border: 0;
    border-radius: calc(1.2 * var(--s));
    padding: calc(0.9 * var(--s)) calc(1.8 * var(--s));
    cursor: pointer;
    white-space: nowrap;
  }

  #notifyBar button:hover:not(:disabled),
  #chatHead button:hover:not(:disabled),
  #compose button:hover:not(:disabled) { background: rgba(0, 0, 0, 0.42); }

  #notifyBar button:disabled, #compose button:disabled { opacity: 0.4; cursor: default; }

  #chat {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(2 * var(--s));
    background: rgba(0, 0, 0, 0.45);
  }

  #chatCard {
    display: flex;
    flex-direction: column;
    width: min(100%, calc(70 * var(--s)));
    max-height: 100%;
    background: var(--bg);
    border-radius: calc(2 * var(--s));
    box-shadow: 0 calc(1 * var(--s)) calc(3 * var(--s)) rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  #chatHead {
    display: flex;
    align-items: center;
    gap: calc(1 * var(--s));
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    border-bottom: 1px solid rgba(0, 0, 0, 0.25);
  }

  #chatTitle {
    flex: 1 1 auto;
    font-size: calc(2.2 * var(--s));
    font-weight: 900;
  }

  #chatLog {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    display: flex;
    flex-direction: column;
    gap: calc(1.2 * var(--s));
  }

  .msg {
    background: rgba(0, 0, 0, 0.22);
    border-radius: calc(1.4 * var(--s));
    padding: calc(1.1 * var(--s)) calc(1.5 * var(--s));
    max-width: 85%;
  }

  .msg.own { align-self: flex-end; background: rgba(0, 0, 0, 0.35); }

  .msg-meta {
    font-size: calc(1.1 * var(--s));
    font-weight: 900;
    letter-spacing: 0.1em;
    opacity: 0.6;
  }

  .msg-text {
    font-size: calc(1.7 * var(--s));
    font-weight: 600;
    margin-top: calc(0.3 * var(--s));
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .msg-empty { opacity: 0.6; font-size: calc(1.6 * var(--s)); font-weight: 600; }

  #compose {
    flex: 0 0 auto;
    display: flex;
    gap: calc(1 * var(--s));
    align-items: stretch;
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    border-top: 1px solid rgba(0, 0, 0, 0.25);
  }

  #composeText {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: calc(1.8 * var(--s));
    font-weight: 600;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.22);
    border: 0;
    border-radius: calc(1.2 * var(--s));
    padding: calc(1 * var(--s)) calc(1.6 * var(--s));
  }

  #composeText::placeholder { color: var(--fg); opacity: 0.5; }
  #composeText:focus { outline: calc(0.25 * var(--s)) solid rgba(0, 0, 0, 0.35); }

  #composeStatus {
    flex: 0 0 auto;
    font-size: calc(1.35 * var(--s));
    font-weight: 700;
    opacity: 0.8;
    padding: 0 calc(0.5 * var(--s));
  }

  #lowerthird {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    padding: 0;
    font-size: min(62vh, 6.8vw);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  #ltClock {
    position: absolute;
    left: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    font-size: 1em;
    font-weight: 900;
  }

  #ltCountdown {
    position: absolute;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font-weight: 900;
  }

  .lt-tag {
    font-size: 0.26em;
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.6;
    margin-top: 0.25em;
  }

  #ltTitle {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-weight: 900;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 0.2em;
  }

  #lowerthird.message #ltClock { display: none; }

  #lowerthird.message #ltTitle {
    background: #ffd60a;
    color: #000;
    box-shadow: 0 0.02em 0.06em rgba(0, 0, 0, 0.35);
  }

  #waiting {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(2.6 * var(--s));
    background: #000;
    color: #f5f5f3;
  }
  #waitingMark {
    width: min(30vw, 50vh);
    height: auto;
    display: block;
    overflow: visible;
  }
  #waitingText {
    font-size: calc(1.7 * var(--s));
    font-weight: 700;
  }
  [data-layout="lowerthird"] #waiting {
    flex-direction: row;
    justify-content: center;
    box-sizing: border-box;
  }
  [data-layout="lowerthird"] #waitingMark {
    width: auto;
  }
  [data-layout="lowerthird"] #waitingText {
    white-space: nowrap;
  }
  [data-layout="lowerthird"] #ltClock {
    z-index: 101;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="standard">
      <div class="rolebar">
        <span class="rolepick" id="rolepick">
          <select id="role" aria-label="Role"></select>
        </span>
        <span class="link" id="link"><span class="dot"></span><span id="linkLabel">Connecting…</span></span>
      </div>

      <div class="stage">
        <div id="cueWord">CLEAR</div>
        <div id="person" class="hidden"></div>
      </div>

      <div id="itemCard" class="hidden">
        <div id="itemTitle"></div>
        <div id="countdown" class="tnum"></div>
        <div id="duration"></div>
      </div>

      <div id="notes"></div>

      <div id="banner" class="hidden" title="Clear this notification everywhere (the message stays in the thread)"></div>

      <div id="notifyBar">
        <button id="openChat" type="button">Messages</button>
      </div>
      <div id="composeStatus" class="hidden"></div>
    </div>

    <div id="chat" class="hidden" role="dialog" aria-label="Messages">
      <div id="chatCard">
        <div id="chatHead">
          <span id="chatTitle">Messages</span>
          <button id="clear" type="button" title="Clear the message history on every device">Clear History</button>
          <button id="closeChat" type="button">Done</button>
        </div>
        <div id="chatLog"></div>
        <form id="compose" autocomplete="off">
          <input id="composeText" type="text" placeholder="Message the producer…" aria-label="Message the producer">
          <button id="send" type="submit">Send</button>
        </form>
      </div>
    </div>

    <div id="lowerthird" class="hidden">
      <span id="ltClock" class="tnum">
        <span id="ltClockValue"></span>
        <span id="ltClockLabel" class="lt-tag">LOCAL TIME</span>
      </span>
      <span id="ltTitle">—</span>
      <span id="ltCountdown" class="tnum">
        <span id="ltCountdownValue">--:--</span>
        <span id="ltDuration" class="lt-tag">PROJECTED</span>
      </span>
    </div>

  </div>

  <div id="waiting" role="status" aria-label="Waiting for Producer">
    <svg id="waitingMark" viewBox="0 0 206 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="wait-top-shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.4"/>
        </filter>
        <style>
          .wait-number {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
          }
          @keyframes wait-rotate-red {
            0% { transform: translateY(0px); }
            16% { transform: translateY(50px); }
            33% { transform: translateY(100px); }
            41% { transform: translateY(50px) translateX(-30px); }
            50% { transform: translateY(0px); }
            66% { transform: translateY(50px); }
            83% { transform: translateY(100px); }
            91% { transform: translateY(50px) translateX(30px); }
            100% { transform: translateY(0px); }
          }
          @keyframes wait-glow-red {
            0%, 32.99% { opacity: 0; }
            33%, 49.99% { opacity: 1; }
            50%, 82.99% { opacity: 0; }
            83%, 99.99% { opacity: 1; }
            100% { opacity: 0; }
          }
          @keyframes wait-rotate-yellow {
            0% { transform: translateY(0px); }
            16% { transform: translateY(50px); }
            24% { transform: translateY(-25px) translateX(-30px); }
            33% { transform: translateY(-50px); }
            50% { transform: translateY(0px); }
            66% { transform: translateY(50px); }
            74% { transform: translateY(-25px) translateX(30px); }
            83% { transform: translateY(-50px); }
            100% { transform: translateY(0px); }
          }
          @keyframes wait-glow-yellow {
            0%, 15.99% { opacity: 0; }
            16%, 32.99% { opacity: 1; }
            33%, 65.99% { opacity: 0; }
            66%, 82.99% { opacity: 1; }
            83%, 100% { opacity: 0; }
          }
          @keyframes wait-rotate-green {
            0% { transform: translateY(0px); }
            8% { transform: translateY(-50px) translateX(-30px); }
            16% { transform: translateY(-100px); }
            33% { transform: translateY(-50px); }
            50% { transform: translateY(0px); }
            58% { transform: translateY(-50px) translateX(30px); }
            66% { transform: translateY(-100px); }
            83% { transform: translateY(-50px); }
            100% { transform: translateY(0px); }
          }
          @keyframes wait-glow-green {
            0%, 15.99% { opacity: 1; }
            16%, 49.99% { opacity: 0; }
            50%, 65.99% { opacity: 1; }
            66%, 100% { opacity: 0; }
          }
          .wait-cycle-red { animation: wait-rotate-red 6s ease-in-out infinite; }
          .wait-cycle-yellow { animation: wait-rotate-yellow 6s ease-in-out infinite; }
          .wait-cycle-green { animation: wait-rotate-green 6s ease-in-out infinite; }
          .wait-glow-red { animation: wait-rotate-red 6s ease-in-out infinite, wait-glow-red 6s ease-in-out infinite; fill: #FF5252; }
          .wait-glow-yellow { animation: wait-rotate-yellow 6s ease-in-out infinite, wait-glow-yellow 6s ease-in-out infinite; fill: #FFEB3B; }
          .wait-glow-green { animation: wait-rotate-green 6s ease-in-out infinite, wait-glow-green 6s ease-in-out infinite; fill: #66BB6A; }
          .wait-num-3 {
            font-size: 220px;
            fill: #F5F5F3;
            stroke: #F5F5F3;
            stroke-width: 12;
            letter-spacing: -0.12em;
            font-stretch: condensed;
          }
        </style>
      </defs>

      <text x="90" y="122" dominant-baseline="middle" class="wait-number wait-num-3">3</text>

      <rect x="20" y="15" width="60" height="170" fill="#F5F5F3"/>

      <circle cx="50" cy="50" r="18" fill="#FF5252" class="wait-cycle-red"/>
      <circle cx="50" cy="100" r="18" fill="#FFEB3B" class="wait-cycle-yellow"/>
      <circle cx="50" cy="150" r="18" fill="#66BB6A" class="wait-cycle-green"/>

      <circle cx="50" cy="50" r="18" class="wait-glow-red"/>
      <circle cx="50" cy="100" r="18" class="wait-glow-yellow"/>
      <circle cx="50" cy="150" r="18" class="wait-glow-green"/>
    </svg>
    <div id="waitingText">Waiting for Producer…</div>
  </div>

<script>
"use strict";

const params = new URLSearchParams(location.search);

const ROLE_PARAM = (params.get("role") || "").trim();

const LAYOUT_PARAM = (params.get("layout") || "auto").toLowerCase().replace(/[^a-z]/g, "");

const ROLE_STORAGE_KEY = "13years.webpager.role";

let snapshot = null;
let snapshotAt = 0;
let producerName = "";
let selectedRoleId = ROLE_PARAM || readStoredRole() || "";
let dismissedMessageId = null;
let socket = null;
let reconnectDelay = 500;

const root = document.documentElement;

const el = {
  standard: document.getElementById("standard"),
  lowerthird: document.getElementById("lowerthird"),
  role: document.getElementById("role"),
  rolepick: document.getElementById("rolepick"),
  link: document.getElementById("link"),
  linkLabel: document.getElementById("linkLabel"),
  cueWord: document.getElementById("cueWord"),
  person: document.getElementById("person"),
  itemCard: document.getElementById("itemCard"),
  itemTitle: document.getElementById("itemTitle"),
  countdown: document.getElementById("countdown"),
  duration: document.getElementById("duration"),
  notes: document.getElementById("notes"),
  banner: document.getElementById("banner"),
  notifyBar: document.getElementById("notifyBar"),
  openChat: document.getElementById("openChat"),
  chat: document.getElementById("chat"),
  chatLog: document.getElementById("chatLog"),
  closeChat: document.getElementById("closeChat"),
  compose: document.getElementById("compose"),
  composeText: document.getElementById("composeText"),
  send: document.getElementById("send"),
  clear: document.getElementById("clear"),
  composeStatus: document.getElementById("composeStatus"),
  ltClock: document.getElementById("ltClock"),
  ltClockValue: document.getElementById("ltClockValue"),
  ltTitle: document.getElementById("ltTitle"),
  ltCountdown: document.getElementById("ltCountdown"),
  ltCountdownValue: document.getElementById("ltCountdownValue"),
  ltDuration: document.getElementById("ltDuration"),
  waiting: document.getElementById("waiting"),
  waitingText: document.getElementById("waitingText"),
  waitingMark: document.getElementById("waitingMark"),
};

function readStoredRole() {
  try { return localStorage.getItem(ROLE_STORAGE_KEY); } catch (_) { return null; }
}

function storeRole(id) {
  try { localStorage.setItem(ROLE_STORAGE_KEY, id); } catch (_) {  }
}

function isLowerThirdViewport() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  return h <= 400 || w / h >= 3;
}

function applyLayout() {
  let layout;
  if (LAYOUT_PARAM === "lowerthird" || LAYOUT_PARAM === "third") {
    layout = "lowerthird";
  } else if (LAYOUT_PARAM === "standard" || LAYOUT_PARAM === "full") {
    layout = "standard";
  } else {
    layout = isLowerThirdViewport() ? "lowerthird" : "standard";
  }
  root.dataset.layout = layout;
  el.standard.classList.toggle("hidden", layout !== "standard");
  el.lowerthird.classList.toggle("hidden", layout !== "lowerthird");
  if (snapshot) render();
}

window.addEventListener("resize", applyLayout);
applyLayout();

function thresholdSeconds() {
  switch (snapshot && snapshot.settings && snapshot.settings.hourFormatThreshold) {
    case "over60Minutes": return 3600;
    case "never": return null;
    default: return 5400;
  }
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatDuration(totalSeconds) {
  const cutoff = thresholdSeconds();
  const abs = Math.abs(totalSeconds);
  let core;
  if (cutoff !== null && abs >= cutoff) {
    core = Math.floor(abs / 3600) + ":" + pad(Math.floor(abs / 60) % 60) + ":" + pad(abs % 60);
  } else {
    core = pad(Math.floor(abs / 60)) + ":" + pad(abs % 60);
  }
  return totalSeconds < 0 ? "+" + core : core;
}

function formatClock(date) {
  return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
}

function roles() { return (snapshot && snapshot.roles) || []; }

function activeRole() {
  const list = roles();
  return list.find((r) => r.id === selectedRoleId) || list[0] || null;
}

function currentCue() {
  const role = activeRole();
  return (role && role.state) || "OFF";
}

function cueWord(state) {
  if (state === "STANDBY" || state === "FLASH_STANDBY") return "STANDBY";
  if (state === "GO" || state === "FLASH_GO") return "GO!";
  return "CLEAR";
}

function activeItem() {
  return (snapshot && snapshot.timer && snapshot.timer.item) || null;
}

function nextItem() {
  if (!snapshot) return null;
  const items = snapshot.plan.items || [];
  return items[snapshot.plan.activeItemIndex + 1] || null;
}

function notesFor(item) {
  const role = activeRole();
  const categories = (role && role.assignedNoteCategories) || [];
  if (!item || !item.notes) return [];
  return categories
    .map((category) => ({ category, text: item.notes[category] }))
    .filter((note) => note.text);
}

function latestRelevantMessage() {
  if (!snapshot) return null;
  return (snapshot.messages || []).find(
    (m) => !m.targetRoleId || m.targetRoleId === selectedRoleId
  ) || null;
}

function remainingSeconds() {
  if (!snapshot || !snapshot.timer) return null;
  const timer = snapshot.timer;
  if (!timer.isRunning) return timer.remainingSeconds;
  const elapsed = (Date.now() - snapshotAt) / 1000;
  return Math.round(timer.remainingSeconds - elapsed);
}

function renderRoles() {
  const list = roles();
  const role = activeRole();
  if (role && role.id !== selectedRoleId) {
    selectedRoleId = role.id;
  }

  const signature = list.map((r) => r.id + ":" + r.name).join("|");
  if (el.role.dataset.signature !== signature) {
    el.role.dataset.signature = signature;
    el.role.innerHTML = "";
    for (const r of list) {
      const option = document.createElement("option");
      option.value = r.id;
      option.textContent = r.name;
      el.role.appendChild(option);
    }
  }
  el.role.value = selectedRoleId;
  el.role.disabled = list.length < 2;
  el.rolepick.classList.toggle("single", list.length < 2);
}

function renderStandard() {
  const role = activeRole();
  const item = activeItem();

  el.cueWord.textContent = cueWord(currentCue());

  const person = role && role.personName;
  el.person.textContent = person ? "FOR: " + person.toUpperCase() : "";
  el.person.classList.toggle("hidden", !person);

  el.itemCard.classList.toggle("hidden", !item);
  if (item) {
    const isHeader = (item.itemType || "").toLowerCase() === "header";
    el.itemCard.dataset.header = isHeader ? "1" : "0";
    el.itemTitle.textContent = (item.title || "").toUpperCase();
    el.countdown.classList.toggle("hidden", isHeader);
    el.duration.classList.toggle("hidden", isHeader);
    if (!isHeader) {
      el.countdown.textContent = formatDuration(remainingSeconds() || 0);
      el.duration.textContent = snapshot.timer.isDurationActualForDisplay ? "ACTUAL" : "PROJECTED";
    }
  }

  const current = notesFor(item);
  const next = notesFor(nextItem());
  const panels = [
    ...current.map((n) => ({ ...n, current: true, multiple: current.length > 1 })),
    ...next.map((n) => ({ ...n, current: false, multiple: next.length > 1 })),
  ];
  const notesSignature = panels.map((p) => p.current + p.category + p.text).join("|");
  if (el.notes.dataset.signature !== notesSignature) {
    el.notes.dataset.signature = notesSignature;
    el.notes.innerHTML = "";
    for (const panel of panels) {
      const base = panel.current ? "CURRENT" : "NEXT";
      const node = document.createElement("div");
      node.className = "note";
      node.dataset.current = panel.current ? "1" : "0";
      const label = document.createElement("div");
      label.className = "note-label";
      label.textContent = panel.multiple ? base + " — " + panel.category.toUpperCase() : base;
      const text = document.createElement("div");
      text.className = "note-text";
      text.textContent = panel.text;
      node.append(label, text);
      el.notes.appendChild(node);
    }
  }

  const notification = activeNotification();
  el.banner.classList.toggle("hidden", !notification);
  if (notification) el.banner.textContent = notification.text;
}

function renderLowerThird() {
  const item = activeItem();
  const message = activeNotification();

  el.lowerthird.classList.toggle("message", message !== null);
  el.ltClockValue.textContent = formatClock(new Date());
  if (message) {
    el.ltTitle.textContent = message.text;
  } else {
    el.ltTitle.textContent = item ? item.title : (snapshot && snapshot.plan && snapshot.plan.title) || "—";
  }

  const isHeader = item && (item.itemType || "").toLowerCase() === "header";
  const remaining = remainingSeconds();
  const hasCountdown = Boolean(item) && !isHeader && remaining !== null;
  el.ltCountdownValue.textContent = hasCountdown ? formatDuration(remaining) : "--:--";
  el.ltDuration.classList.toggle("hidden", !hasCountdown);
  if (hasCountdown) {
    el.ltDuration.textContent = snapshot.timer.isDurationActualForDisplay ? "ACTUAL" : "PROJECTED";
  }

  fitTitle(layoutLowerThird(message !== null));
}

function activeNotification() {
  const message = latestRelevantMessage();
  if (!message || message.id === dismissedMessageId) return null;
  const cutoff = snapshot && snapshot.notificationsClearedAt;
  if (cutoff && Date.parse(message.timestamp) <= Date.parse(cutoff)) return null;
  return message;
}

function layoutLowerThird(isMessage) {
  const strip = el.lowerthird;

  const blockHeight = Math.max(el.ltClock.offsetHeight, el.ltCountdown.offsetHeight);
  const inset = Math.max((strip.clientHeight - blockHeight) / 2, 0);
  el.ltClock.style.left = inset + "px";
  el.ltCountdown.style.right = inset + "px";

  const style = getComputedStyle(strip);
  const pad = inset;
  const gap = parseFloat(style.fontSize) * 0.25;
  const inner = strip.clientWidth - pad * 2;
  const countdown = el.ltCountdown.offsetWidth;
  const base = parseFloat(style.fontSize);
  const padX = base * 0.22;
  const padY = base * 0.12;
  el.ltTitle.style.padding = padY + "px " + padX + "px";

  let available;
  if (isMessage) {
    available = inner - countdown - gap;
    el.ltTitle.style.left = pad + "px";
    el.ltTitle.style.transform = "none";
    el.ltTitle.style.width = Math.max(available, 0) + "px";
  } else {
    const side = Math.max(el.ltClock.offsetWidth, countdown);
    available = inner - (side + gap) * 2;
    el.ltTitle.style.left = "50%";
    el.ltTitle.style.transform = "translateX(-50%)";
    el.ltTitle.style.width = "";
  }
  available = Math.max(available, 0);
  el.ltTitle.style.maxWidth = available + "px";
  return Math.max(available - padX * 2, 0);
}

const measurer = document.createElement("span");
measurer.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;";
document.body.appendChild(measurer);

let lastFit = "";
let fittedSize = "";

function fitTitle(available) {
  const node = el.ltTitle;
  node.style.fontSize = "";
  const style = getComputedStyle(node);
  const base = parseFloat(style.fontSize);
  const key = node.textContent + "@" + Math.round(available) + "@" + Math.round(base);
  if (key === lastFit) {
    node.style.fontSize = fittedSize;
    return;
  }
  lastFit = key;

  measurer.style.fontFamily = style.fontFamily;
  measurer.style.fontWeight = style.fontWeight;
  measurer.style.letterSpacing = style.letterSpacing;
  measurer.style.fontSize = base + "px";
  measurer.textContent = node.textContent;

  const needed = measurer.offsetWidth;
  fittedSize = needed > available && needed > 0
    ? Math.max(base * 0.3, (base * available * 0.98) / needed) + "px"
    : "";
  node.style.fontSize = fittedSize;
}

function render() {
  if (!snapshot) return;
  root.dataset.cue = currentCue();
  renderRoles();
  updateSendEnabled();
  renderChat();
  if (root.dataset.layout === "lowerthird") {
    renderLowerThird();
  } else {
    renderStandard();
  }
}

const HEARTBEAT_MS = 2000;
const STALE_AFTER_MS = 6500;

function threadMessages() {
  if (!snapshot) return [];
  return (snapshot.messages || [])
    .filter((m) => !m.targetRoleId || m.targetRoleId === selectedRoleId)
    .slice()
    .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp));
}

function renderChat() {
  if (el.chat.classList.contains("hidden")) return;
  const messages = threadMessages();
  const signature = messages.map((m) => m.id).join("|") + "@" + selectedRoleId;
  if (el.chatLog.dataset.signature === signature) return;
  const wasAtBottom = el.chatLog.scrollTop + el.chatLog.clientHeight >= el.chatLog.scrollHeight - 40;
  el.chatLog.dataset.signature = signature;
  el.chatLog.innerHTML = "";

  if (messages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "msg-empty";
    empty.textContent = "No messages yet";
    el.chatLog.appendChild(empty);
    return;
  }

  for (const message of messages) {
    const own = message.senderRoleId === selectedRoleId;
    const node = document.createElement("div");
    node.className = own ? "msg own" : "msg";

    const meta = document.createElement("div");
    meta.className = "msg-meta";
    const scope = message.targetRoleId ? "DIRECT" : "EVERYONE";
    meta.textContent = scope + " · " + (message.sender || "Producer") + " · " + formatTime(message.timestamp);

    const text = document.createElement("div");
    text.className = "msg-text";
    text.textContent = message.text;

    node.append(meta, text);
    el.chatLog.appendChild(node);
  }

  if (wasAtBottom) el.chatLog.scrollTop = el.chatLog.scrollHeight;
}

function formatTime(timestamp) {
  const date = new Date(timestamp);
  return isNaN(date) ? "" : date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function renderConnection() {
  const live = snapshot !== null && Date.now() - snapshotAt < STALE_AFTER_MS;
  el.link.dataset.live = live ? "1" : "0";
  el.linkLabel.textContent = live
    ? (producerName ? "Live — " + producerName : "Live")
    : "Reconnecting…";
  el.waiting.classList.toggle("hidden", live);
  if (!live && root.dataset.layout === "lowerthird") fitWaiting();
}

function fitWaiting() {
  const strip = el.lowerthird;
  el.ltClockValue.textContent = formatClock(new Date());
  const inset = Math.max((strip.clientHeight - el.ltClock.offsetHeight) / 2, 0);
  el.ltClock.style.left = inset + "px";
  const left = inset * 2 + el.ltClock.offsetWidth;
  const width = Math.max(window.innerWidth - left - inset, 0);
  const aspect = 206 / 200;
  let markHeight = window.innerHeight * 0.9;
  const gap = markHeight * 0.12;
  const maxFont = window.innerHeight * 0.62;
  el.waiting.style.paddingLeft = left + "px";
  el.waiting.style.gap = gap + "px";
  el.waitingText.style.fontSize = maxFont + "px";
  const textWidth = el.waitingText.getBoundingClientRect().width || 1;
  const room = width - markHeight * aspect - gap;
  let font = maxFont;
  if (room < textWidth) font = Math.max(maxFont * room / textWidth, markHeight * 0.1);
  if (font === markHeight * 0.1) {
    const scale = Math.min(width / (markHeight * aspect + gap + textWidth * font / maxFont), 1);
    markHeight *= scale;
    font *= scale;
  }
  el.waitingText.style.fontSize = font + "px";
  el.waitingMark.style.height = markHeight + "px";
}

setInterval(() => {
  if (!snapshot) {
    renderConnection();
    return;
  }
  if (root.dataset.layout === "lowerthird") {
    renderLowerThird();
  } else if (!el.countdown.classList.contains("hidden")) {
    el.countdown.textContent = formatDuration(remainingSeconds() || 0);
  }
  renderConnection();
}, 250);

function adopt(state) {
  snapshot = state;
  snapshotAt = Date.now();
  if (!selectedRoleId) {
    selectedRoleId = (state.roles && state.roles[0] && state.roles[0].id) || "";
  } else if (ROLE_PARAM) {
    const match = (state.roles || []).find(
      (r) => r.id === ROLE_PARAM ||
             r.id.toLowerCase() === ROLE_PARAM.toLowerCase() ||
             r.name.toLowerCase() === ROLE_PARAM.toLowerCase()
    );
    if (match) selectedRoleId = match.id;
  }
  render();
  renderConnection();
}

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/socket";
  let ws;
  try {
    ws = new WebSocket(url);
  } catch (_) {
    return;
  }
  socket = ws;

  ws.onopen = () => {
    reconnectDelay = 500;
  };

  ws.onmessage = (event) => {
    let payload;
    try { payload = JSON.parse(event.data); } catch (_) { return; }
    if (payload.event === "hello" || payload.event === "state") adopt(payload.data);
  };

  ws.onclose = () => {
    socket = null;
    renderConnection();
    reconnectDelay = Math.min(reconnectDelay * 2, 1000);
    setTimeout(connect, reconnectDelay);
  };

  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}

async function fetchOnce() {
  try {
    const response = await fetch("/v1/state", { cache: "no-store" });
    if (!response.ok) return;
    adopt(await response.json());
  } catch (_) {
    renderConnection();
  }
}

async function fetchProducerName() {
  try {
    const response = await fetch("/v1/health", { cache: "no-store" });
    if (!response.ok) return;
    const health = await response.json();
    producerName = health.device || "";
    renderConnection();
  } catch (_) {  }
}

setInterval(() => {
  if (Date.now() - snapshotAt >= HEARTBEAT_MS) fetchOnce();
  if (!producerName && snapshot) fetchProducerName();
}, 1000);

el.role.addEventListener("change", () => {
  selectedRoleId = el.role.value;
  storeRole(selectedRoleId);
  const message = latestRelevantMessage();
  dismissedMessageId = message ? message.id : null;
  render();
});

let statusTimer = null;

function showStatus(text) {
  el.composeStatus.textContent = text;
  el.composeStatus.classList.toggle("hidden", !text);
  clearTimeout(statusTimer);
  if (text) statusTimer = setTimeout(() => showStatus(""), 4000);
}

async function post(path, options) {
  const response = await fetch(path, { cache: "no-store", ...options });
  if (!response.ok) throw new Error("HTTP " + response.status);
  await fetchOnce();
}

function updateSendEnabled() {
  el.send.disabled = !selectedRoleId || el.composeText.value.trim() === "";
}

el.composeText.addEventListener("input", updateSendEnabled);
updateSendEnabled();

el.compose.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = el.composeText.value.trim();
  if (!text || !selectedRoleId) return;

  el.send.disabled = true;
  try {
    await post("/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        text,
        targetRoleId: selectedRoleId,
        senderRoleId: selectedRoleId,
      }),
    });
    el.composeText.value = "";
    updateSendEnabled();
    const own = latestRelevantMessage();
    if (own && own.senderRoleId === selectedRoleId) dismissedMessageId = own.id;
    render();
    showStatus("Sent");
  } catch (_) {
    showStatus("Couldn't send — check the connection");
  } finally {
    el.send.disabled = false;
  }
});

let clearArmed = null;

el.clear.addEventListener("click", async () => {
  if (!clearArmed) {
    el.clear.textContent = "Confirm clear?";
    showStatus("Deletes every message on every device — press again");
    clearArmed = setTimeout(disarmClear, 5000);
    return;
  }
  disarmClear();

  el.clear.disabled = true;
  try {
    await post("/v1/messages", { method: "DELETE" });
    dismissedMessageId = null;
    render();
    showStatus("History cleared");
  } catch (_) {
    showStatus("Couldn't clear — check the connection");
  } finally {
    el.clear.disabled = false;
  }
});

function disarmClear() {
  clearTimeout(clearArmed);
  clearArmed = null;
  el.clear.textContent = "Clear History";
}

el.openChat.addEventListener("click", () => {
  el.chat.classList.remove("hidden");
  el.chatLog.dataset.signature = "";
  renderChat();
  el.composeText.focus();
});

el.closeChat.addEventListener("click", () => el.chat.classList.add("hidden"));

el.chat.addEventListener("click", (event) => {
  if (event.target === el.chat) el.chat.classList.add("hidden");
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") el.chat.classList.add("hidden");
});

el.banner.addEventListener("click", async () => {
  const message = activeNotification();
  if (!message) return;
  dismissedMessageId = message.id;
  render();
  try {
    await post("/v1/messages/dismiss", { method: "POST" });
    showStatus("Notification cleared");
  } catch (_) {
    dismissedMessageId = null;
    render();
    showStatus("Couldn't clear — check the connection");
  }
});

fetchOnce();
fetchProducerName();
connect();
</script>
</body>
</html>
