<style>
  :root {
    --cue-off-bg: #141a26;
    --cue-off-fg: #ffffff;
    --cue-standby-bg: #f5b826;
    --cue-standby-fg: #1a1a1a;
    --cue-go-bg: #26c759;
    --cue-go-fg: #ffffff;

    --s: min(1.2vh, 2.2vw);

    --bg: var(--cue-off-bg);
    --fg: var(--cue-off-fg);
    --ink: #f5f5f7;
    --cuefull: #111114;
  }

  [data-cue="STANDBY"], [data-cue="FLASH_STANDBY"] {
    --bg: var(--cue-standby-bg);
    --fg: var(--cue-standby-fg);
    --ink: #1a1a1a;
    --cuefull: var(--cue-standby-bg);
  }
  [data-cue="GO"], [data-cue="FLASH_GO"] {
    --bg: var(--cue-go-bg);
    --fg: var(--cue-go-fg);
    --ink: #ffffff;
    --cuefull: var(--cue-go-bg);
  }

  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Medium.ttf") format("truetype");
    font-weight: 500; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 600; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Bold.ttf") format("truetype");
    font-weight: 700; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-ExtraBold.ttf") format("truetype");
    font-weight: 800; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Black.ttf") format("truetype");
    font-weight: 900; font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-feature-settings: "zero" 1;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; }

  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .hidden { display: none !important; }

  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "zero" 1; }

  .rolepick {
    position: relative;
    display: inline-flex;
    align-items: center;
    max-width: 60%;
    font-size: max(16px, calc(1.8 * var(--s)));
  }

  .rolepick::after {
    content: "";
    position: absolute;
    right: calc(1.2 * var(--s));
    width: 0.4em;
    height: 0.4em;
    border-right: 0.12em solid currentColor;
    border-bottom: 0.12em solid currentColor;
    transform: translateY(-25%) rotate(45deg);
    pointer-events: none;
    opacity: 0.75;
  }

  .rolepick.single::after { display: none; }

  #role {
    font: inherit;
    font-size: 1em;
    font-weight: 700;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.22);
    border: 0;
    border-radius: calc(0.9 * var(--s));
    padding: calc(0.7 * var(--s)) calc(3.2 * var(--s)) calc(0.7 * var(--s)) calc(1.4 * var(--s));
    min-height: 44px;
    max-width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  .fr-roleslot #role { flex: 1 1 auto; width: 100%; }
  #role:disabled { opacity: 1; }
  #role option { color: #111; background: #fff; }

  .dot {
    width: calc(1 * var(--s));
    height: calc(1 * var(--s));
    border-radius: 50%;
    background: #ff3b30;
  }
  .conn-row[data-live="1"] .dot { background: #30d158; }

  [data-stage="amber"] { color: #ff9f0a; color: color-mix(in srgb, var(--fg) 70%, #ff9f0a); }
  [data-stage="red"] { color: #ff453a; color: color-mix(in srgb, var(--fg) 60%, #ff3b30); }
  #iconRow {
    display: flex;
    gap: calc(var(--u) * 0.01);
    width: 0;
    min-width: 100%;
  }
  #iconRow button { flex: 1 1 0; min-width: 0; }
  #chatHead #composeStatus { margin-right: auto; }

  #iconRow button, #chatHead button, #compose button {
    font: inherit;
    font-size: calc(1.5 * var(--s));
    font-weight: 700;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.3);
    border: 0;
    border-radius: calc(1.2 * var(--s));
    padding: calc(0.9 * var(--s)) calc(1.8 * var(--s));
    min-height: 44px;
    min-width: 44px;
    cursor: pointer;
    white-space: nowrap;
  }

  #iconRow button:hover:not(:disabled),
  #chatHead button:hover:not(:disabled),
  #compose button:hover:not(:disabled) { background: rgba(0, 0, 0, 0.42); }

  #iconRow button:disabled, #compose button:disabled { opacity: 0.4; cursor: default; }

  #chat {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(2 * var(--s) + env(safe-area-inset-top)) calc(2 * var(--s) + env(safe-area-inset-right)) calc(2 * var(--s) + env(safe-area-inset-bottom)) calc(2 * var(--s) + env(safe-area-inset-left));
    background: rgba(0, 0, 0, 0.45);
  }

  #chatCard {
    display: flex;
    flex-direction: column;
    width: min(100%, calc(70 * var(--s)));
    max-height: 100%;
    background: var(--bg);
    border-radius: calc(2 * var(--s));
    box-shadow: 0 calc(1 * var(--s)) calc(3 * var(--s)) rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  #chatHead {
    display: flex;
    align-items: center;
    gap: calc(1 * var(--s));
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    border-bottom: 1px solid rgba(0, 0, 0, 0.25);
  }

  #chatTitle {
    flex: 1 1 auto;

<script id="core">
"use strict";

const HEARTBEAT_MS = 2000;
const STALE_AFTER_MS = 6500;
const V2_SILENCE_MS = 25000;
const LEGACY_SILENCE_MS = 12000;
const CONNECT_TIMEOUT_MS = 10000;
const POLL_DOWN_MS = 5000;
const PROTO_TIMEOUT_MS = 3000;
const REST_TIMEOUT_MS = 3000;
const WAKE_STALE_MS = 5000;
const BURST_RETRY_MS = 5000;
const BACKOFF_BASE_MS = 500;
const BACKOFF_CAP_MS = 5000;
const SYNC_KEEP = 8;
const SYNC_BURST = 5;
const SYNC_BURST_GAP_MS = 100;
const SYNC_PERIOD_MS = 30000;
const SLEW_LIMIT_MS = 20;
const EXTENDED_DISCONNECT_MS = 20000;
const SLEW_FACTOR = 0.25;
const SAMPLE_MAX_AGE_MS = 90000;
const SAMPLE_MAX_RTT_MS = 10000;
const SAMPLE_MAX_OFFSET_MS = 86400000;
const SAMPLE_JUMP_FLOOR_MS = 50;
const REV_MAX_JUMP = 1000000;
const ANCHOR_MAX_LENGTH_S = 604800;
const ANCHOR_MAX_ELAPSED_MS = 604800000;
const LOWER_THIRD_ASPECT = 3;
const FNV_BASIS_HI = 0xcbf29ce4;
const FNV_BASIS_LO = 0x84222325;
const US = "\u001f";
const RS = "\u001e";

function hex32(value) {
  return (value >>> 0).toString(16).padStart(8, "0");
}

function fnv1a64(text) {
  let hi = FNV_BASIS_HI;
  let lo = FNV_BASIS_LO;
  const bytes = new TextEncoder().encode(text);
  for (let i = 0; i < bytes.length; i++) {
    lo = (lo ^ bytes[i]) >>> 0;
    const product = lo * 0x1b3;
    const carry = Math.floor(product / 4294967296);
    const nextLo = product % 4294967296;
    hi = (Math.imul(hi, 0x1b3) + (lo << 8) + carry) >>> 0;
    lo = nextLo;
  }
  return hex32(hi) + hex32(lo);
}

function rolesCanonical(roles) {
  return (roles || []).map((r) => r.id + US + r.name + US + r.state + RS).join("");
}

function timerCanonical(anchor) {
  if (!anchor) return "none";
  return [
    anchor.itemId,
    anchor.lengthInSeconds,
    anchor.isRunning ? 1 : 0,
    anchor.isDurationActual ? 1 : 0,
    anchor.elapsedMs,
    anchor.anchorMs,
  ].join(US);
}

function utf8Compare(a, b) {
  const encoder = new TextEncoder();
  const x = encoder.encode(a);
  const y = encoder.encode(b);
  const n = Math.min(x.length, y.length);
  for (let i = 0; i < n; i++) if (x[i] !== y[i]) return x[i] - y[i];
  return x.length - y.length;
}

function messageTime(message) {
  const t = typeof message.timestamp === "number" ? message.timestamp : Date.parse(message.timestamp);
  return isNaN(t) ? -Infinity : t;
}

function compareMessages(a, b) {
  const ta = messageTime(a);
  const tb = messageTime(b);
  if (ta !== tb) return ta > tb ? -1 : 1;
  return utf8Compare(String(a.id), String(b.id));
}

function messagesCanonical(messages) {
  return (messages || []).slice().sort(compareMessages).slice(0, 16).map((m) => m.id).join(RS);
}

function planCanonical(plan) {
  const items = (plan && plan.items) || [];
  return items
    .map((i) => i.id + US + i.title + US + i.lengthInSeconds + US + (i.isDurationActual ? 1 : 0) + RS)
    .join("") + String(plan ? plan.activeItemIndex : 0);
}

function localHashes(snap) {
  return {
    roles: fnv1a64(rolesCanonical(snap.roles)),
    timer: fnv1a64(timerCanonical(snap.timer && snap.timer.anchor)),
    messages: fnv1a64(messagesCanonical(snap.messages)),
    plan: snap.plan ? fnv1a64(planCanonical(snap.plan)) : undefined,
  };
}

function validAnchor(anchor) {
  return Boolean(anchor) && typeof anchor === "object" &&
    typeof anchor.lengthInSeconds === "number" && isFinite(anchor.lengthInSeconds) &&
    typeof anchor.elapsedMs === "number" && isFinite(anchor.elapsedMs) &&
    typeof anchor.anchorMs === "number" && isFinite(anchor.anchorMs) &&
    anchor.lengthInSeconds >= 0 && anchor.lengthInSeconds <= ANCHOR_MAX_LENGTH_S &&
    anchor.elapsedMs >= 0 && anchor.elapsedMs <= ANCHOR_MAX_ELAPSED_MS;
}

function sanitizeTimer(timer) {
  if (!timer || !timer.anchor || validAnchor(timer.anchor)) return timer;
  const copy = {};
  for (const key of Object.keys(timer)) if (key !== "anchor") copy[key] = timer[key];
  return copy;
}

function sanitizeState(state) {
  if (!state || !state.timer) return state;
  const timer = sanitizeTimer(state.timer);
  if (timer === state.timer) return state;
  const copy = {};
  for (const key of Object.keys(state)) copy[key] = state[key];
  copy.timer = timer;
  return copy;
}

function createClockSync(mono) {
  const monotonic = mono || (() => 0);
  let samples = [];
  let offset = 0;
  let ready = false;
  function best() {
    let pick = samples[0];
    for (const s of samples) if (s.rtt <= pick.rtt) pick = s;
    return pick;
  }
  return {
    addSample(t0, t1, t2, t3, at) {
      const now = monotonic();
      const rtt = Math.max(0, (t3 - t0) - (t2 - t1));
      const sampleOffset = ((t1 - t0) + (t2 - t3)) / 2;
      if (!isFinite(rtt) || !isFinite(sampleOffset)) return offset;
      if (rtt > SAMPLE_MAX_RTT_MS || Math.abs(sampleOffset) > SAMPLE_MAX_OFFSET_MS) return offset;
      samples = samples.filter((s) => now - s.at <= SAMPLE_MAX_AGE_MS);
      if (samples.length > 0 && Math.abs(sampleOffset - best().offset) > Math.max(SAMPLE_JUMP_FLOOR_MS, 2 * rtt)) {
        samples = [];
      }
      samples.push({ rtt, offset: sampleOffset, at: at === undefined ? now : at });
      if (samples.length > SYNC_KEEP) samples.shift();
      const pick = best();
      if (!ready) {
        offset = pick.offset;
        ready = true;
      } else {
        const delta = pick.offset - offset;
        offset = Math.abs(delta) < SLEW_LIMIT_MS ? offset + delta * SLEW_FACTOR : pick.offset;
      }
      return offset;
    },
    clear() { samples = []; },
    reset() {
      samples = [];
      offset = 0;
      ready = false;
    },
    get count() { return samples.length; },
    get offset() { return offset; },
    get rtt() { return samples.length ? best().rtt : null; },
    get ready() { return ready; },
    producerNow(localNow) { return localNow + offset; },
  };
}

function anchorElapsedRaw(anchor, producerNowMs) {
  return anchor.elapsedMs + (anchor.isRunning ? producerNowMs - anchor.anchorMs : 0);
}

function anchorElapsedMs(anchor, producerNowMs) {
  return Math.max(0, anchorElapsedRaw(anchor, producerNowMs));
}

function anchorRemainingSeconds(anchor, producerNowMs) {
  return anchor.lengthInSeconds - Math.floor(anchorElapsedMs(anchor, producerNowMs) / 1000);
}

function anchorNextBoundaryMs(anchor, producerNowMs) {
  if (!anchor.isRunning) return null;
  const raw = anchorElapsedRaw(anchor, producerNowMs);
  return 1000 - (((raw % 1000) + 1000) % 1000) + 1;
}

function countdownStage(remaining) {
  if (typeof remaining !== "number" || isNaN(remaining)) return "";
  if (remaining < 30) return "red";
  if (remaining < 60) return "amber";
  return "";
}

function backoffDelay(attempt, rand) {
  const r = Math.min(Math.max(rand, 0), 1);
  const base = Math.min(BACKOFF_CAP_MS, BACKOFF_BASE_MS * Math.pow(2, Math.max(0, attempt)));
  return Math.round(base * (0.5 + 0.5 * r));
}

function isHeaderItem(item) {
  return Boolean(item) && String(item.itemType || "").toLowerCase() === "header";
}

function nextItemFor(snap) {
  if (!snap) return null;
  const timer = snap.timer;
  if (timer && timer.nextItem !== undefined) return timer.nextItem || null;
  const plan = snap.plan;
  if (!plan || !Array.isArray(plan.items)) return null;
  const start = (typeof plan.activeItemIndex === "number" ? plan.activeItemIndex : -1) + 1;
  for (let i = Math.max(0, start); i < plan.items.length; i++) {
    if (!isHeaderItem(plan.items[i])) return plan.items[i];
  }
  return null;
}

function notesForRole(item, role) {
  const categories = (role && role.assignedNoteCategories) || [];
  if (!item || !item.notes) return [];
  return categories
    .map((category) => ({ category, text: item.notes[category] }))
    .filter((note) => note.text);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function noteEntryHTML(category, text) {
  return "<strong>" + escapeHtml(category) + ":</strong> " + escapeHtml(text);
}

function formatProjectedLength(seconds, cutoff) {
  const total = Math.max(0, Math.round(Number(seconds) || 0));
  const two = (n) => String(n).padStart(2, "0");
  if (cutoff !== null && cutoff !== undefined && total >= cutoff) {
    return Math.floor(total / 3600) + ":" + two(Math.floor(total / 60) % 60) + ":" + two(total % 60);
  }
  return Math.floor(total / 60) + ":" + two(total % 60);
}

function fitScale(measure, cap, min, steps) {
  const floor = min > 0 ? min : 0.3;
  if (measure(1) <= cap) return 1;
  if (measure(floor) > cap) return floor;
  let lo = floor;
  let hi = 1;
  for (let i = 0; i < (steps || 8); i++) {
    const mid = (lo + hi) / 2;
    if (measure(mid) <= cap) lo = mid; else hi = mid;
  }
  return lo;
}

function bottomRowMode(hasMessage, hasNotes, hasNext) {
  if (hasMessage) return "message";
  if (hasNotes && hasNext) return "both";
  if (hasNotes) return "left";
  if (hasNext) return "right";
  return "none";
}

function clockSlotFor(state) {
  const word = cueWordFor(state);
  return word ? { mode: "cue", word } : { mode: "clock", word: "" };
}

function cueWordFor(state) {
  if (state === "STANDBY" || state === "FLASH_STANDBY") return "STANDBY";
  if (state === "GO" || state === "FLASH_GO") return "GO!";
  return "";
}

function lowerThirdForViewport(width, height) {
  return height > 0 && width / height >= LOWER_THIRD_ASPECT;
}

function parseCueDisplay(value) {
  const text = String(value === undefined || value === null ? "" : value).toLowerCase().replace(/[^a-z]/g, "");
  if (text === "outline") return "outline";
  if (text === "full" || text === "fullscreen") return "full";
  return null;
}

function cueDisplayFor(param, stored) {
  return parseCueDisplay(param) || parseCueDisplay(stored) || "outline";
}

function layoutFor(width, height, param) {
  const value = String(param || "auto").toLowerCase().replace(/[^a-z]/g, "");
  if (value === "lowerthird" || value === "third") return "lowerthird";
  if (value === "landscape") return "landscape";
  if (value === "standard" || value === "full" || value === "portrait") return "standard";
  if (lowerThirdForViewport(width, height)) return "lowerthird";
  return height > 0 && width > height ? "landscape" : "standard";
}

function parseFlagParam(value, fallback) {
  const text = String(value === null || value === undefined ? "" : value).trim().toLowerCase();
  if (text === "0" || text === "false" || text === "no") return false;
  if (text === "1" || text === "true" || text === "yes") return true;
  return fallback;
}

function disconnectPhase(live, elapsedMs) {
  if (elapsedMs >= EXTENDED_DISCONNECT_MS) return "extended";
  return live ? "live" : "stale";
}

function connectionStateText(phase, hasSnapshot) {
  if (!hasSnapshot) return "Connecting";
  if (phase === "live") return "Live";
  if (phase === "extended") return "Disconnected";
  return "Connecting";
}

function syncQualityText(ready, offsetMs, rttMs) {
  if (!ready || typeof offsetMs !== "number" || !isFinite(offsetMs)) return "";
  const offset = Math.round(offsetMs);
  const text = "Offset " + (offset > 0 ? "+" : "") + offset + " ms";
  if (typeof rttMs !== "number" || !isFinite(rttMs)) return text;
  return text + ", round trip " + Math.round(rttMs) + " ms";
}

const localTimeFormats = new Map();

function formatLocalTime(date, locale, timeZone) {
  const key = String(locale) + "|" + String(timeZone);
  try {
    let format = localTimeFormats.get(key);
    if (!format) {
      const options = { hour: "numeric", minute: "2-digit" };
      if (timeZone) options.timeZone = timeZone;
      format = new Intl.DateTimeFormat(locale, options);
      localTimeFormats.set(key, format);
    }
    return format.format(date);
  } catch (_) {
    return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
}

function msUntilNextSecond(nowMs) {
  return 1000 - (((nowMs % 1000) + 1000) % 1000);
}

function countdownEmWidth(text) {
  let width = 0;
  for (const ch of String(text)) {
    if (ch >= "0" && ch <= "9") width += 0.68;
    else if (ch === ":") width += 0.32;
    else width += 0.7;
  }
  return Math.max(width, 1);
}

function matchRole(roles, param) {
  if (!param) return null;
  const lower = param.toLowerCase();
  const match = (roles || []).find(
    (r) => r.id === param || r.id.toLowerCase() === lower || String(r.name).toLowerCase() === lower
  );
  return match ? match.id : null;
}

function createRoleSelection(param, stored) {
  let id = param || stored || "";
  let paramPending = Boolean(param);
  return {
    get id() { return id; },
    select(value) {
      id = value;
      paramPending = false;
    },
    adopt(roles) {
      const list = roles || [];
      if (!id) id = (list[0] && list[0].id) || "";
      if (paramPending && list.length > 0) {
        paramPending = false;
        const match = matchRole(list, param);
        if (match) id = match;
      }
      return id;
    },
  };
}

function createWakeLock(env) {
  let sentinel = null;
  let requesting = false;
  async function acquire() {
    if (sentinel || requesting) return false;
    const nav = env.navigator;
    if (!nav || !nav.wakeLock || typeof nav.wakeLock.request !== "function") return false;
    if (!env.visible()) return false;
    requesting = true;
    try {
      const lock = await nav.wakeLock.request("screen");
      sentinel = lock;
      if (lock && typeof lock.addEventListener === "function") {
        lock.addEventListener("release", () => {
          if (sentinel === lock) sentinel = null;
        });
      }
      return true;
    } catch (_) {
      return false;
    } finally {
      requesting = false;
    }
  }
  return { acquire, get held() { return sentinel !== null; } };
}

async function restRequest(env, url, options, wantJson) {
  const work = (async () => {
    const signal = env.timeoutSignal ? env.timeoutSignal(REST_TIMEOUT_MS) : undefined;
    const init = Object.assign({}, options);
    if (signal) init.signal = signal;
    const response = await env.fetch(url, init);
    const body = wantJson && response.ok ? await response.json() : null;
    return { ok: response.ok, status: response.status, body };
  })();
  let timer = null;
  const limit = new Promise((resolve, reject) => {
    timer = env.setTimeout(() => reject(new Error("timeout")), REST_TIMEOUT_MS);
  });
  try {
    return await Promise.race([work, limit]);
  } finally {
    env.clearTimeout(timer);
    work.catch(() => {});
  }
}

function createLink(env) {
  const mono = env.mono || env.now;
  const random = env.random || Math.random;
  const clock = createClockSync(mono);
  const pending = new Map();
  let ws = null;
  let mode = null;
  let heldRev = -1;
  let heldEpoch = null;
  let rebase = false;
  let lastFrameAt = 0;
  let snapshotAt = 0;
  let connectedAt = 0;
  let lastBurstAt = -Infinity;
  let lastPollAt = env.now();
  let attempt = 0;
  let nextId = 1;
  let fetching = null;
  let syncTimer = null;
  let protoTimer = null;
  let reconnectTimer = null;

  function isOpen() { return ws !== null && ws.readyState === 1; }

  function setMode(value) {
    mode = value;
    if (env.onMode) env.onMode();
  }

  function send(op, body, handler) {
    const id = "c" + nextId++;
    pending.set(id, handler);
    ws.send(JSON.stringify({ id, op, body }));
  }

  function full(state) {
    snapshotAt = env.now();
    env.onFull(sanitizeState(state));
  }

  function sampleOnce() {
    if (mode !== "v2" || !isOpen()) return;
    const t0 = env.now();
    send("sync", { t0 }, (reply) => {
      if (reply.status !== 200 || !reply.data) return;
      const t3 = env.now();
      clock.addSample(typeof reply.data.t0 === "number" ? reply.data.t0 : t0, reply.data.t1, reply.data.t2, t3, mono());
      if (env.onClock) env.onClock();
    });
  }

  function schedulePeriodic() {
    env.clearTimeout(syncTimer);
    syncTimer = env.setTimeout(() => {
      sampleOnce();
      schedulePeriodic();
    }, SYNC_PERIOD_MS);
  }

  function startSync() {
    lastBurstAt = env.now();
    sampleOnce();
    for (let i = 1; i < SYNC_BURST; i++) env.setTimeout(sampleOnce, i * SYNC_BURST_GAP_MS);
    schedulePeriodic();
  }

  function noteEpoch(data) {
    if (!data || typeof data.epoch !== "number") return false;
    if (heldEpoch === null || heldEpoch === data.epoch) {
      heldEpoch = data.epoch;
      return false;
    }
    heldEpoch = data.epoch;
    heldRev = -1;
    rebase = true;
    clock.reset();
    if (env.onEpoch) env.onEpoch();
    if (mode === "v2" && isOpen()) startSync();
    return true;
  }

  function applyFetched(state) {
    const epochChanged = noteEpoch(state);
    const rev = typeof state.rev === "number" ? state.rev : null;
    if (rev !== null) {
      if (!rebase && !epochChanged && rev < heldRev) return;
      heldRev = rebase ? rev : Math.max(heldRev, rev);
    }
    rebase = false;
    full(state);
  }

  function fetchState() {
    if (fetching) return fetching;
    fetching = (async () => {
      try {
        const result = await restRequest(env, "/v1/state", { cache: "no-store" }, true);
        if (!result.ok || !result.body) return;
        applyFetched(result.body);
      } catch (_) {
        env.onStatus();
      } finally {
        fetching = null;
      }
    })();
    return fetching;
  }

  function guard(rev, epochChanged) {
    if (mode !== "v2" || typeof rev !== "number") return true;
    if (!epochChanged) {
      if (rev <= heldRev) return false;
      if (heldRev >= 0 && rev - heldRev > REV_MAX_JUMP) return false;
    }
    heldRev = rev;
    return true;
  }

  function onDigest(data) {
    if (mode !== "v2" || !data || !data.hashes) return;
    if (typeof data.rev === "number") {
      if (data.rev < heldRev) return;
      if (heldRev >= 0 && data.rev - heldRev > REV_MAX_JUMP) return;
    }
    const snap = env.getSnapshot();
    if (!snap) {
      fetchState();
      return;
    }
    const local = localHashes(snap);
    for (const key of ["roles", "timer", "plan", "messages"]) {
      if (typeof data.hashes[key] === "string" && local[key] !== undefined && local[key] !== data.hashes[key]) {
        fetchState();
        return;
      }
    }
  }

  function onFrame(text) {
    let payload;
    try { payload = JSON.parse(text); } catch (_) { return; }
    lastFrameAt = env.now();
    attempt = 0;
    if (payload.id !== undefined && pending.has(payload.id)) {
      const handler = pending.get(payload.id);
      pending.delete(payload.id);
      handler(payload);
      return;
    }
    const event = payload.event;
    if (event !== "hello" && event !== "state" && event !== "timer" && event !== "digest") return;
    const data = payload.data;
    const epochChanged = noteEpoch(data);
    if (mode === "v2" && !clock.ready && env.now() - lastBurstAt > BURST_RETRY_MS) startSync();
    if (event === "hello") {
      heldRev = data && typeof data.rev === "number" ? data.rev : -1;
      rebase = false;
      full(data);
    } else if (event === "state") {
      if (guard(data && data.rev, epochChanged)) {
        rebase = false;
        full(data);
      }
    } else if (event === "timer") {
      if (!data || !env.getSnapshot()) return;
      const rev = typeof data.rev === "number" ? data.rev : payload.rev;
      if (!guard(rev, epochChanged)) return;
      snapshotAt = env.now();
      env.onTimer(sanitizeTimer(data.timer));
      if (epochChanged) fetchState();
    } else if (epochChanged) {
      fetchState();
    } else {
      onDigest(data);
    }
  }

  function dropSocket() {
    const sock = ws;
    ws = null;
    if (sock) {
      sock.onopen = null;
      sock.onmessage = null;
      sock.onclose = null;
      sock.onerror = null;
      try { sock.close(); } catch (_) {}
    }
    lastPollAt = env.now();
    pending.clear();
    env.clearTimeout(protoTimer);
    env.clearTimeout(syncTimer);
    setMode(null);
    env.onStatus();
  }

  function scheduleReconnect() {
    env.clearTimeout(reconnectTimer);
    const delay = backoffDelay(attempt, random());
    attempt += 1;
    reconnectTimer = env.setTimeout(connect, delay);
  }

  function forceReconnect() {
    dropSocket();
    connect();
  }

  function connect() {
    env.clearTimeout(reconnectTimer);
    reconnectTimer = null;
    if (ws) return;
    let sock;
    try {
      sock = new env.WebSocket(env.url);
    } catch (_) {
      env.onStatus();
      scheduleReconnect();
      return;
    }
    ws = sock;
    connectedAt = env.now();

    sock.onopen = () => {
      if (ws !== sock) return;
      lastFrameAt = env.now();
      clock.clear();
      rebase = true;
      setMode("pending");
      send("proto", { version: 2 }, (reply) => {
        if (ws !== sock) return;
        env.clearTimeout(protoTimer);
        if (reply.status === 200) {
          setMode("v2");
          startSync();
        } else if (mode === "pending") {
          setMode("legacy");
        }
      });
      protoTimer = env.setTimeout(() => {
        if (ws === sock && mode === "pending") setMode("legacy");
      }, PROTO_TIMEOUT_MS);
    };

    sock.onmessage = (event) => {
      if (ws === sock) onFrame(event.data);
    };

    sock.onclose = () => {
      if (ws !== sock) return;
      dropSocket();
      scheduleReconnect();
    };

    sock.onerror = () => { try { sock.close(); } catch (_) {} };
  }

  function wake() {
    clock.clear();
    if (!ws) {
      connect();
      return;
    }
    if (isOpen() && env.now() - lastFrameAt > WAKE_STALE_MS) {
      forceReconnect();
      return;
    }
    if (mode === "v2" && isOpen()) startSync();
  }

  function pollTick() {
    const now = env.now();
    if (ws && ws.readyState === 0 && now - connectedAt >= CONNECT_TIMEOUT_MS) {
      forceReconnect();
      return;
    }
    if (!isOpen()) {
      if (now - lastPollAt >= POLL_DOWN_MS) {
        lastPollAt = now;
        fetchState();
      }
      return;
    }
    const limit = mode === "v2" ? V2_SILENCE_MS : LEGACY_SILENCE_MS;
    if (now - lastFrameAt >= limit) {
      forceReconnect();
      return;
    }
    if (mode === "legacy" && now - snapshotAt >= HEARTBEAT_MS) fetchState();
  }

  function isLive() {
    if (env.getSnapshot() === null) return false;
    if (mode === "v2") return isOpen() && env.now() - lastFrameAt < V2_SILENCE_MS;
    return env.now() - snapshotAt < STALE_AFTER_MS;
  }

  return {
    connect,
    fetchState,
    pollTick,
    isLive,
    wake,
    producerNow() { return clock.producerNow(env.now()); },
    get mode() { return mode; },
    get clockReady() { return clock.ready; },
    get offset() { return clock.offset; },
    get rtt() { return clock.rtt; },
    get sampleCount() { return clock.count; },
    get heldRev() { return heldRev; },
    get epoch() { return heldEpoch; },
    get lastContactAt() { return Math.max(lastFrameAt, snapshotAt); },
  };
}
</script>

<script>
"use strict";

const params = new URLSearchParams(location.search);

const ROLE_PARAM = (params.get("role") || "").trim();

const STAGES_ENABLED = params.get("stages") === "1";

const CUE_PARAM = params.get("cue");

const SHOW_SETTINGS = parseFlagParam(params.get("settings"), true);

const SHOW_MESSAGES = parseFlagParam(params.get("messages"), true);
const ALLOW_ROLE_CHANGE = parseFlagParam(params.get("roles"), true);

let snapshot = null;
let lastLtKey = "";
let lastMessageMode = null;
let lastClockText = "";
let lastWaitKey = "";
let snapshotAt = 0;
let producerName = "";
const roleSel = createRoleSelection(ROLE_PARAM, readStoredRole());
let dismissedMessageId = null;
let cueDisplay = "outline";

const root = document.documentElement;

const el = {
  standard: document.getElementById("standard"),
  lowerthird: document.getElementById("lowerthird"),
  landscape: document.getElementById("landscape"),
  lsTop: document.getElementById("lsTop"),
  lsRoleSlot: document.getElementById("lsRoleSlot"),
  lsSlot: document.getElementById("lsSlot"),
  lsBadge: document.getElementById("lsBadge"),
  lsNextLength: document.getElementById("lsNextLength"),
  ltCue: document.getElementById("ltCue"),
  lsTimeValue: document.getElementById("lsTimeValue"),
  lsTitle: document.getElementById("lsTitle"),
  lsCountdown: document.getElementById("lsCountdown"),
  lsTag: document.getElementById("lsTag"),
  lsNotes: document.getElementById("lsNotes"),
  lsNext: document.getElementById("lsNext"),
  lsNextTitle: document.getElementById("lsNextTitle"),
  lsNextNotes: document.getElementById("lsNextNotes"),
  lsBottom: document.getElementById("lsBottom"),
  lsMessage: document.getElementById("lsMessage"),
  lsMessageText: document.getElementById("lsMessageText"),
  lsMessageFrom: document.getElementById("lsMessageFrom"),
  ptRoleSlot: document.getElementById("ptRoleSlot"),
  ptSlot: document.getElementById("ptSlot"),
  ptBadge: document.getElementById("ptBadge"),
  ptTimeValue: document.getElementById("ptTimeValue"),
  ptMid: document.getElementById("ptMid"),
  ptCard: document.getElementById("ptCard"),
  ptTitle: document.getElementById("ptTitle"),
  ptCountdown: document.getElementById("ptCountdown"),
  ptTag: document.getElementById("ptTag"),
  ptNotes: document.getElementById("ptNotes"),
  ptNext: document.getElementById("ptNext"),
  ptNextTitle: document.getElementById("ptNextTitle"),
  ptNextLength: document.getElementById("ptNextLength"),
  ptNextNotes: document.getElementById("ptNextNotes"),
  ptMessage: document.getElementById("ptMessage"),
  ptMessageText: document.getElementById("ptMessageText"),
  ptMessageFrom: document.getElementById("ptMessageFrom"),
  role: document.getElementById("role"),
  rolepick: document.getElementById("rolepick"),
  iconRow: document.getElementById("iconRow"),
  connState: document.getElementById("connState"),
  connStateText: document.getElementById("connStateText"),
  connProducer: document.getElementById("connProducer"),
  connSyncRow: document.getElementById("connSyncRow"),
  connSync: document.getElementById("connSync"),
  openChat: document.getElementById("openChat"),
  openSettings: document.getElementById("openSettings"),
  settings: document.getElementById("settings"),
  closeSettings: document.getElementById("closeSettings"),
  chat: document.getElementById("chat"),
  chatLog: document.getElementById("chatLog"),
  closeChat: document.getElementById("closeChat"),
  compose: document.getElementById("compose"),

  composeStatus: document.getElementById("composeStatus"),
  ltClock: document.getElementById("ltClock"),
  ltClockValue: document.getElementById("ltClockValue"),
  ltTitle: document.getElementById("ltTitle"),
  ltCountdown: document.getElementById("ltCountdown"),
  ltCountdownValue: document.getElementById("ltCountdownValue"),
  ltDuration: document.getElementById("ltDuration"),
  waiting: document.getElementById("waiting"),
  offline: document.getElementById("offline"),
  waitingText: document.getElementById("waitingText"),
  waitingMark: document.getElementById("waitingMark"),
};

function readStoredRole() {
  try { return localStorage.getItem(ROLE_STORAGE_KEY); } catch (_) { return null; }
}

function storeRole(id) {
  try { localStorage.setItem(ROLE_STORAGE_KEY, id); } catch (_) {  }
}

function readStoredCueDisplay() {
  try { return localStorage.getItem(CUE_DISPLAY_KEY); } catch (_) { return null; }
}

function storeCueDisplay(value) {
  try { localStorage.setItem(CUE_DISPLAY_KEY, value); } catch (_) {  }
}

function renderCueButtons() {
  for (const button of document.querySelectorAll("[data-cue-display]")) {
    button.setAttribute("aria-pressed", button.dataset.cueDisplay === cueDisplay ? "true" : "false");
  }
}

function setCueDisplay(value, remember) {
  cueDisplay = value;
  root.dataset.cuedisplay = value;
  if (remember) storeCueDisplay(value);
  renderCueButtons();
  lastFitKey = "";
  lastPortraitKey = "";
}

function applyControlVisibility() {
  if (!SHOW_SETTINGS) el.openSettings.remove();
  if (!SHOW_MESSAGES) el.openChat.remove();
  if (!SHOW_SETTINGS && !SHOW_MESSAGES) {
    el.iconRow.remove();
    root.dataset.icons = "none";
  }
}

function placeShared(layout) {
  const landscape = layout === "landscape";
  const home = landscape ? el.lsRoleSlot : el.ptRoleSlot;
  if (el.rolepick.parentNode !== home) home.append(el.rolepick);
  if (root.dataset.icons !== "none" && el.iconRow.parentNode !== home) home.append(el.iconRow);
}

function applyLayout() {
  const layout = layoutFor(window.innerWidth, window.innerHeight, LAYOUT_PARAM);
  if (root.dataset.layout !== layout) lastLtKey = "";
  root.dataset.layout = layout;
  placeShared(layout);
  el.standard.classList.toggle("hidden", layout !== "standard");
  el.lowerthird.classList.toggle("hidden", layout !== "lowerthird");
  el.landscape.classList.toggle("hidden", layout !== "landscape");
  tickLocalTime();
  if (snapshot) render();
}

let localTimer = null;

function tickLocalTime() {
  clearTimeout(localTimer);
  localTimer = null;
  const layout = root.dataset.layout;
  if (layout !== "landscape" && layout !== "standard") return;
  setText(layout === "landscape" ? el.lsTimeValue : el.ptTimeValue, formatClock(new Date()));
  localTimer = setTimeout(tickLocalTime, msUntilNextSecond(Date.now()) + 5);
}

let lastFitKey = "";
let lastPortraitKey = "";

const parsedCueParam = parseCueDisplay(CUE_PARAM);
setCueDisplay(cueDisplayFor(CUE_PARAM, readStoredCueDisplay()), Boolean(parsedCueParam));

window.addEventListener("resize", applyLayout);
applyLayout();

function thresholdSeconds() {
  switch (snapshot && snapshot.settings && snapshot.settings.hourFormatThreshold) {
    case "over60Minutes": return 3600;
    case "never": return null;
    default: return 5400;
  }
}

function setText(node, value) {
  if (node.__t === value) return;
  node.__t = value;
  node.textContent = value;
}

function setHidden(node, hidden) {
  if (node.__h === hidden) return;
  node.__h = hidden;
  node.classList.toggle("hidden", hidden);
}

function setStage(node, remaining) {
  if (!STAGES_ENABLED) return;
  const stage = typeof remaining === "number" ? countdownStage(remaining) : "";
  if (node.__s === stage) return;
  node.__s = stage;
  if (stage) node.dataset.stage = stage;
  else delete node.dataset.stage;
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatDuration(totalSeconds) {
  const cutoff = thresholdSeconds();
  const abs = Math.abs(totalSeconds);
  let core;
  if (cutoff !== null && abs >= cutoff) {
    core = Math.floor(abs / 3600) + ":" + pad(Math.floor(abs / 60) % 60) + ":" + pad(abs % 60);
  } else {
    core = pad(Math.floor(abs / 60)) + ":" + pad(abs % 60);
  }
  return totalSeconds < 0 ? "+" + core : core;
}

function formatClock(date) {
  return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
}

function roles() { return (snapshot && snapshot.roles) || []; }

function activeRole() {
  const list = roles();
  return list.find((r) => r.id === roleSel.id) || list[0] || null;
}

function currentCue() {
  const role = activeRole();
  return (role && role.state) || "OFF";
}

function cueWord(state) { return cueWordFor(state); }

function activeItem() {
  return (snapshot && snapshot.timer && snapshot.timer.item) || null;
}

function nextItem() { return nextItemFor(snapshot); }

function notesFor(item) { return notesForRole(item, activeRole()); }

function buildNote(category, text, current) {
  const node = document.createElement("div");
  node.className = "note";
  node.dataset.current = current ? "1" : "0";
  node.innerHTML = noteEntryHTML(category, text);
  return node;
}

function latestRelevantMessage() {
  if (!snapshot) return null;
  return (snapshot.messages || []).find(
    (m) => !m.targetRoleId || m.targetRoleId === roleSel.id
  ) || null;
}

function remainingSeconds() {
  if (!snapshot || !snapshot.timer) return null;
  const timer = snapshot.timer;
  if (link.mode === "v2" && link.clockReady && timer.anchor) {
    return anchorRemainingSeconds(timer.anchor, link.producerNow());
  }
  if (!timer.isRunning) return timer.remainingSeconds;
  const elapsed = (Date.now() - snapshotAt) / 1000;
  return Math.round(timer.remainingSeconds - elapsed);
}

function renderRoles() {
  const list = roles();
  const role = activeRole();
  if (role && role.id !== roleSel.id) {
    roleSel.select(role.id);
  }

  const signature = list.map((r) => r.id + ":" + r.name).join("|");
  if (el.role.dataset.signature !== signature) {
    el.role.dataset.signature = signature;
    el.role.innerHTML = "";
    for (const r of list) {
      const option = document.createElement("option");
      option.value = r.id;
      option.textContent = r.name;
      el.role.appendChild(option);
    }
  }
  el.role.value = roleSel.id;
  const locked = list.length < 2 || !ALLOW_ROLE_CHANGE;
  el.role.disabled = locked;
  el.rolepick.classList.toggle("single", locked);
}

function renderCountdown(view, hideEmpty) {
  const item = activeItem();
  const isHeader = Boolean(item) && (item.itemType || "").toLowerCase() === "header";
  const remaining = remainingSeconds();
  const hasCountdown = Boolean(item) && !isHeader && remaining !== null;
  const text = hasCountdown ? formatDuration(remaining) : "";
  setText(view.countdown, text);
  if (view.countdown.__em !== text.length) {
    view.countdown.__em = text.length;
    view.countdown.style.setProperty("--em", String(countdownEmWidth(text) * 1.04));
  }
  setStage(view.countdown, hasCountdown ? remaining : null);
  setText(view.tag, hasCountdown ? (snapshot.timer.isDurationActualForDisplay ? "ACTUAL" : "PROJECTED") : "");
  setHidden(view.tag, !hasCountdown);
  if (hideEmpty) setHidden(view.countdown, !hasCountdown);
}

function fillNotes(container, signature, notes) {
  if (container.dataset.signature === signature) return;
  container.dataset.signature = signature;
  container.innerHTML = "";
  notes.forEach((n, index) => container.appendChild(buildNote(n.category, n.text, index === 0)));
}

const landscapeView = { countdown: el.lsCountdown, tag: el.lsTag };
const portraitView = { countdown: el.ptCountdown, tag: el.ptTag };

function renderSlot(badge, slot) {
  const word = cueWord(currentCue());
  setText(badge, word || "STANDBY");
  slot.classList.toggle("cue", clockSlotFor(currentCue()).mode === "cue");
}

function renderLandscape() {
  const item = activeItem();

  renderSlot(el.lsBadge, el.lsSlot);

  const title = item ? item.title : (snapshot && snapshot.plan && snapshot.plan.title) || "";
  setText(el.lsTitle, (title || "").toUpperCase());
  renderCountdown(landscapeView, false);

  const current = notesFor(item);
  const upcoming = nextItem();
  const message = activeNotification();
  const mode = bottomRowMode(Boolean(message), current.length > 0, Boolean(upcoming));
  fillNotes(el.lsNotes, current.map((n) => n.category + n.text).join("|"), current);
  setHidden(el.lsBottom, mode === "message" || mode === "none");
  setHidden(el.lsMessage, mode !== "message");
  setHidden(el.lsNotes, mode === "right");
  setHidden(el.lsNext, mode === "left");
  if (el.lsBottom.dataset.mode !== mode) el.lsBottom.dataset.mode = mode;
  if (upcoming) {
    setText(el.lsNextTitle, (upcoming.title || "").toUpperCase());
    const length = upcoming.lengthInSeconds;
    setText(el.lsNextLength, typeof length === "number" ? formatProjectedLength(length, thresholdSeconds()) : "");
    const nextNotes = notesFor(upcoming);
    fillNotes(
      el.lsNextNotes,
      upcoming.id + "|" + nextNotes.map((n) => n.category + n.text).join("|"),
      nextNotes
    );
  }

  if (message) {
    setText(el.lsMessageText, message.text);
    setText(el.lsMessageFrom, "From " + (message.sender || "Producer"));
  }
  fitLandscapeBottom(mode);
}

function renderPortrait() {
  const item = activeItem();

  renderSlot(el.ptBadge, el.ptSlot);

  const isHeader = isHeaderItem(item);
  const title = item ? item.title : (snapshot && snapshot.plan && snapshot.plan.title) || "";
  setText(el.ptTitle, (title || "").toUpperCase());
  renderCountdown(portraitView, true);

  const current = isHeader ? [] : notesFor(item);
  fillNotes(el.ptNotes, current.map((n) => n.category + n.text).join("|"), current);
  setHidden(el.ptCard, !title && el.ptCountdown.classList.contains("hidden") && current.length === 0);

  const upcoming = nextItem();
  setHidden(el.ptNext, !upcoming);
  if (upcoming) {
    setText(el.ptNextTitle, (upcoming.title || "").toUpperCase());
    const length = upcoming.lengthInSeconds;
    setText(el.ptNextLength, typeof length === "number" ? formatProjectedLength(length, thresholdSeconds()) : "");
    const nextNotes = notesFor(upcoming);
    fillNotes(
      el.ptNextNotes,
      upcoming.id + "|" + nextNotes.map((n) => n.category + n.text).join("|"),
      nextNotes
    );
  }

  const message = activeNotification();
  setHidden(el.ptMessage, !message);
  if (message) {
    setText(el.ptMessageText, message.text);
    setText(el.ptMessageFrom, "From " + (message.sender || "Producer"));
  }
  fitPortrait(Boolean(message));
}

function fitPortrait(hasMessage) {
  const u = Math.min(window.innerWidth, window.innerHeight);
  const key = [
    u, window.innerHeight, hasMessage ? 1 : 0, el.ptTitle.textContent, el.ptCountdown.__em,
    el.ptNotes.dataset.signature, el.ptNext.classList.contains("hidden") ? 0 : 1,
    el.ptNextNotes.dataset.signature, el.ptNextTitle.textContent, el.ptNextLength.textContent,
    el.ptMessageText.textContent, el.ptMessageFrom.textContent,
    el.ptCard.classList.contains("hidden") ? 0 : 1, el.ptTag.textContent,
  ].join("\u0001");
  if (key === lastPortraitKey) return;
  lastPortraitKey = key;
  if (hasMessage) {
    const panel = el.ptMessage;
    const text = el.ptMessageText;
    const measure = (k) => {
      panel.style.setProperty("--k", String(k));
      const lineHeight = u * 0.055 * k * 1.15;
      const lines = Math.round(text.scrollHeight / lineHeight);
      return lines > 4 ? Infinity : panel.scrollHeight;
    };
    panel.style.setProperty("--k", String(fitScale(measure, u * 0.34, 0.25)));
  }
  if (!el.ptNext.classList.contains("hidden")) {
    const card = el.ptNext;
    const k = fitScale((value) => {
      card.style.setProperty("--k", String(value));
      return card.scrollHeight;
    }, u * 0.28, 0.3);
    card.style.setProperty("--k", String(k));
  }
  if (!el.ptCard.classList.contains("hidden")) {
    const card = el.ptCard;
    const room = el.ptMid.clientHeight;
    card.style.setProperty("--kh", "1");
    const k = fitScale((value) => {
      card.style.setProperty("--k", String(value));
      return card.offsetHeight;
    }, room, 0.5);
    card.style.setProperty("--k", String(k));
    if (card.offsetHeight > room) {
      const kh = fitScale((value) => {
        card.style.setProperty("--kh", String(value));
        return card.offsetHeight;
      }, room, 0.4);
      card.style.setProperty("--kh", String(kh));
    }
  }
}

function fitLandscapeBottom(mode) {
  const u = Math.min(window.innerWidth, window.innerHeight);
  const key = [mode, u, el.lsNotes.dataset.signature, el.lsNextNotes.dataset.signature, el.lsNextTitle.textContent, el.lsNextLength.textContent, el.lsMessageText.textContent, el.lsMessageFrom.textContent].join("\u0001");
  if (key === lastFitKey) return;
  lastFitKey = key;
  if (mode === "message") {
    const panel = el.lsMessage;
    const text = el.lsMessageText;
    const measure = (k) => {
      panel.style.setProperty("--k", String(k));
      const lineHeight = u * 0.07 * k * 1.15;
      const lines = Math.round(text.scrollHeight / lineHeight);
      return lines > 3 ? Infinity : panel.scrollHeight;
    };
    panel.style.setProperty("--k", String(fitScale(measure, u * 0.23, 0.25)));
    return;
  }
  for (const card of [el.lsNotes, el.lsNext]) {
    if (card.classList.contains("hidden")) continue;
    card.style.alignSelf = "start";
    const k = fitScale((value) => {
      card.style.setProperty("--k", String(value));
      return card.scrollHeight;
    }, u * 0.28, 0.3);
    card.style.setProperty("--k", String(k));
    card.style.alignSelf = "";
  }
}

function renderLowerThird() {
  const item = activeItem();
  const message = activeNotification();
  const isMessage = message !== null;

  if (lastMessageMode !== isMessage) {
    lastMessageMode = isMessage;
    el.lowerthird.classList.toggle("message", isMessage);
  }
  const clockText = formatClock(new Date());
  lastClockText = clockText;
  setText(el.ltClockValue, clockText);
  const slot = clockSlotFor(currentCue());
  setText(el.ltCue, slot.word || "STANDBY");
  el.ltClock.classList.toggle("cue", slot.mode === "cue");
  const title = message
    ? message.text
    : item ? item.title : (snapshot && snapshot.plan && snapshot.plan.title) || "—";
  setText(el.ltTitle, title);

  const isHeader = item && (item.itemType || "").toLowerCase() === "header";
  const remaining = remainingSeconds();
  const hasCountdown = Boolean(item) && !isHeader && remaining !== null;
  const countdownText = hasCountdown ? formatDuration(remaining) : "--:--";
  setText(el.ltCountdownValue, countdownText);
  setStage(el.ltCountdownValue, hasCountdown ? remaining : null);
  setHidden(el.ltDuration, !hasCountdown);
  let durationText = "";
  if (hasCountdown) {
    durationText = snapshot.timer.isDurationActualForDisplay ? "ACTUAL" : "PROJECTED";
    setText(el.ltDuration, durationText);
  }

  const key = [
    title, isMessage ? 1 : 0, window.innerWidth, window.innerHeight,
    clockText.length, countdownText.length, durationText,
  ].join("|");
  if (key === lastLtKey) return;
  lastLtKey = key;
  fitTitle(layoutLowerThird(isMessage));
}

function paintClock() {
  if (root.dataset.layout !== "lowerthird" || !snapshot) return;
  if (formatClock(new Date()) !== lastClockText) renderLowerThird();
}

function activeNotification() {
  const message = latestRelevantMessage();
  if (!message || message.id === dismissedMessageId) return null;
  const cutoff = snapshot && snapshot.notificationsClearedAt;
  if (cutoff && Date.parse(message.timestamp) <= Date.parse(cutoff)) return null;
  return message;
}

function layoutLowerThird(isMessage) {
  const strip = el.lowerthird;

  const blockHeight = Math.max(el.ltClock.offsetHeight, el.ltCountdown.offsetHeight);
  const inset = Math.max((strip.clientHeight - blockHeight) / 2, 0);
  el.ltClock.style.left = inset + "px";
  el.ltCountdown.style.right = inset + "px";

  const style = getComputedStyle(strip);
  const pad = inset;
  const gap = parseFloat(style.fontSize) * 0.25;
  const inner = strip.clientWidth - pad * 2;
  const countdown = el.ltCountdown.offsetWidth;
  const base = parseFloat(style.fontSize);
  const padX = base * 0.22;
  const padY = base * 0.12;
  el.ltTitle.style.padding = padY + "px " + padX + "px";

  let available;
  if (isMessage) {
    available = inner - countdown - gap;
    el.ltTitle.style.left = pad + "px";
    el.ltTitle.style.transform = "none";
    el.ltTitle.style.width = Math.max(available, 0) + "px";
  } else {
    const side = Math.max(el.ltClock.offsetWidth, countdown);
    available = inner - (side + gap) * 2;
    el.ltTitle.style.left = "50%";
    el.ltTitle.style.transform = "translateX(-50%)";
    el.ltTitle.style.width = "";
  }
  available = Math.max(available, 0);
  el.ltTitle.style.maxWidth = available + "px";
  return Math.max(available - padX * 2, 0);
}

const measurer = document.createElement("span");
measurer.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;";
document.body.appendChild(measurer);

let lastFit = "";
let fittedSize = "";

function fitTitle(available) {
  const node = el.ltTitle;
  node.style.fontSize = "";
  const style = getComputedStyle(node);
  const base = parseFloat(style.fontSize);
  const key = node.textContent + "@" + Math.round(available) + "@" + Math.round(base);
  if (key === lastFit) {
    node.style.fontSize = fittedSize;
    return;
  }
  lastFit = key;

  measurer.style.fontFamily = style.fontFamily;
  measurer.style.fontWeight = style.fontWeight;
  measurer.style.letterSpacing = style.letterSpacing;
  measurer.style.fontSize = base + "px";
  measurer.textContent = node.textContent;

  const needed = measurer.offsetWidth;
  fittedSize = needed > available && needed > 0
    ? Math.max(base * 0.3, (base * available * 0.98) / needed) + "px"
    : "";
  node.style.fontSize = fittedSize;
}

function render() {
  if (!snapshot) return;
  root.dataset.cue = currentCue();
  renderRoles();
  updateSendEnabled();
  renderChat();
  if (root.dataset.layout === "lowerthird") {
    renderLowerThird();
  } else if (root.dataset.layout === "landscape") {
    renderLandscape();
  } else {
    renderPortrait();
  }
}

function threadMessages() {
  if (!snapshot) return [];
  return (snapshot.messages || [])
    .filter((m) => !m.targetRoleId || m.targetRoleId === roleSel.id)
    .slice()
    .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp));
}

function renderChat() {
  if (el.chat.classList.contains("hidden")) return;
  const messages = threadMessages();
  const signature = messages.map((m) => m.id).join("|") + "@" + roleSel.id;
  if (el.chatLog.dataset.signature === signature) return;
  const wasAtBottom = el.chatLog.scrollTop + el.chatLog.clientHeight >= el.chatLog.scrollHeight - 40;
  el.chatLog.dataset.signature = signature;
  el.chatLog.innerHTML = "";

  if (messages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "msg-empty";
    empty.textContent = "No messages yet";
    el.chatLog.appendChild(empty);
    return;
  }

  for (const message of messages) {
    const own = message.senderRoleId === roleSel.id;
    const node = document.createElement("div");
    node.className = own ? "msg own" : "msg";

    const meta = document.createElement("div");
    meta.className = "msg-meta";
    const scope = message.targetRoleId ? "DIRECT" : "EVERYONE";
    meta.textContent = scope + " · " + (message.sender || "Producer") + " · " + formatTime(message.timestamp);

    const text = document.createElement("div");
    text.className = "msg-text";
    text.textContent = message.text;

    node.append(meta, text);
    el.chatLog.appendChild(node);
  }

  if (wasAtBottom) el.chatLog.scrollTop = el.chatLog.scrollHeight;
}

function formatTime(timestamp) {
  const date = new Date(timestamp);
  return isNaN(date) ? "" : date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function offlineText() {
  const seconds = Math.max(0, Math.round((Date.now() - link.lastContactAt) / 1000));
  const age = seconds < 120 ? seconds + " s" : Math.floor(seconds / 60) + " min";
  return "No connection — last update " + age + " ago";
}

function renderConnection() {
  const live = link.isLive();
  const hasSnapshot = snapshot !== null;
  const phase = disconnectPhase(live, Date.now() - link.lastContactAt);
  const lowerThird = root.dataset.layout === "lowerthird";
  const extended = hasSnapshot && !live && phase === "extended" && !lowerThird;
  const fullOverlay = (!live && !hasSnapshot) || extended;
  const offline = !live && hasSnapshot && !fullOverlay;
  setHidden(el.waiting, !fullOverlay);
  setHidden(el.offline, !offline);
  const offlineFlag = offline ? "1" : "0";
  if (root.dataset.offline !== offlineFlag) root.dataset.offline = offlineFlag;
  if (offline) setText(el.offline, offlineText());
  if (fullOverlay && lowerThird) fitWaiting();
  const liveFlag = live ? "1" : "0";
  if (el.connState.dataset.live !== liveFlag) el.connState.dataset.live = liveFlag;
  setText(el.connStateText, connectionStateText(phase, hasSnapshot));
  setText(el.connProducer, producerName || "—");
  const sync = link.mode === "v2" ? syncQualityText(link.clockReady, link.offset, link.rtt) : "";
  setHidden(el.connSyncRow, sync === "");
  if (sync !== "") setText(el.connSync, sync);
}

function fitWaiting() {
  const strip = el.lowerthird;
  const clockText = formatClock(new Date());
  const waitKey = clockText + "|" + window.innerWidth + "|" + window.innerHeight;
  if (waitKey === lastWaitKey) return;
  lastWaitKey = waitKey;
  setText(el.ltClockValue, clockText);
  const inset = Math.max((strip.clientHeight - el.ltClock.offsetHeight) / 2, 0);
  el.ltClock.style.left = inset + "px";
  const left = inset * 2 + el.ltClock.offsetWidth;
  const width = Math.max(window.innerWidth - left - inset, 0);
  const aspect = 206 / 200;
  let markHeight = window.innerHeight * 0.9;
  const gap = markHeight * 0.12;
  const maxFont = window.innerHeight * 0.62;
  el.waiting.style.paddingLeft = left + "px";
  el.waiting.style.gap = gap + "px";
  el.waitingText.style.fontSize = maxFont + "px";
  const textWidth = el.waitingText.getBoundingClientRect().width || 1;
  const room = width - markHeight * aspect - gap;
  let font = maxFont;
  if (room < textWidth) font = Math.max(maxFont * room / textWidth, markHeight * 0.1);
  if (font === markHeight * 0.1) {
    const scale = Math.min(width / (markHeight * aspect + gap + textWidth * font / maxFont), 1);
    markHeight *= scale;
    font *= scale;
  }
  el.waitingText.style.fontSize = font + "px";
  el.waitingMark.style.height = markHeight + "px";
}

function paintCountdown() {
  if (!snapshot || document.hidden) return;
  if (root.dataset.layout === "lowerthird") {
    renderLowerThird();
  } else if (root.dataset.layout === "landscape") {
    renderCountdown(landscapeView, false);
  } else {
    renderCountdown(portraitView, true);
  }
}

let tickTimer = null;

function scheduleTick() {
  clearTimeout(tickTimer);
  tickTimer = null;
  if (link.mode !== "v2" || !link.clockReady || !snapshot || !snapshot.timer || !snapshot.timer.anchor) return;
  const delay = anchorNextBoundaryMs(snapshot.timer.anchor, link.producerNow());
  if (delay === null) return;
  tickTimer = setTimeout(() => {
    paintCountdown();
    scheduleTick();
  }, delay);
}

setInterval(() => {
  if (document.hidden) return;
  if (tickTimer === null) paintCountdown();
  else paintClock();
  renderConnection();
}, 250);

function adopt(state) {
  snapshot = state;
  snapshotAt = Date.now();
  roleSel.adopt(state.roles);
  render();
  renderConnection();
  scheduleTick();
}

function adoptTimer(timer) {
  snapshot.timer = timer;
  snapshotAt = Date.now();
  render();
  scheduleTick();
}

const restEnv = {
  fetch: (url, init) => fetch(url, init),
  setTimeout: (fn, ms) => setTimeout(fn, ms),
  clearTimeout: (id) => clearTimeout(id),
  timeoutSignal: (ms) => {
    if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") return AbortSignal.timeout(ms);
    if (typeof AbortController === "undefined") return undefined;
    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return controller.signal;
  },
};

const link = createLink({
  WebSocket,
  fetch: restEnv.fetch,
  timeoutSignal: restEnv.timeoutSignal,
  now: () => Date.now(),
  mono: () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now()),
  setTimeout: (fn, ms) => setTimeout(fn, ms),
  clearTimeout: (id) => clearTimeout(id),
  url: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/socket",
  getSnapshot: () => snapshot,
  onFull: adopt,
  onTimer: adoptTimer,
  onStatus: renderConnection,
  onEpoch: () => {
    if (snapshot && snapshot.timer && snapshot.timer.anchor) {
      snapshot = Object.assign({}, snapshot, { timer: Object.assign({}, snapshot.timer, { anchor: null }) });
    }
    scheduleTick();
  },
  onMode: () => {
    scheduleTick();
    renderConnection();
  },
  onClock: () => {
    paintCountdown();
    scheduleTick();
  },
});

function fetchOnce() {
  return link.fetchState();
}

let healthPending = false;

async function fetchProducerName() {
  if (healthPending) return;
  healthPending = true;
  try {
    const result = await restRequest(restEnv, "/v1/health", { cache: "no-store" }, true);
    if (!result.ok || !result.body) return;
    producerName = result.body.device || "";
    renderConnection();
  } catch (_) {
  } finally {
    healthPending = false;
  }
}

const wakeLock = createWakeLock({
  navigator,
  visible: () => document.visibilityState === "visible",
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  link.wake();
  wakeLock.acquire();
  lastLtKey = "";
  lastWaitKey = "";
  tickLocalTime();
  if (snapshot) render();
  renderConnection();
  scheduleTick();
});

document.addEventListener("pointerdown", () => { wakeLock.acquire(); }, { passive: true });

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    lastLtKey = "";
    lastFit = "";
    lastFitKey = "";
    lastPortraitKey = "";
    if (snapshot) render();
  });
}

setInterval(() => {
  link.pollTick();
  if (!producerName && snapshot) fetchProducerName();
}, 1000);

el.role.addEventListener("change", () => {
  roleSel.select(el.role.value);
  storeRole(roleSel.id);
  const message = latestRelevantMessage();
  dismissedMessageId = message ? message.id : null;
  render();
});

let statusTimer = null;

function showStatus(text) {
  el.composeStatus.textContent = text;
  el.composeStatus.classList.toggle("hidden", !text);
  clearTimeout(statusTimer);
  if (text) statusTimer = setTimeout(() => showStatus(""), 4000);
}

async function post(path, options) {
  const result = await restRequest(restEnv, path, Object.assign({ cache: "no-store" }, options), false);
  if (!result.ok) throw new Error("HTTP " + result.status);
  await fetchOnce();
}

function updateSendEnabled() {
  el.send.disabled = !roleSel.id || el.composeText.value.trim() === "";
}

el.composeText.addEventListener("input", updateSendEnabled);
updateSendEnabled();

el.compose.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = el.composeText.value.trim();
  if (!text || !roleSel.id) return;

  el.send.disabled = true;
  try {
    await post("/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        text,
        targetRoleId: roleSel.id,
        senderRoleId: roleSel.id,
      }),
    });
    el.composeText.value = "";
    updateSendEnabled();
    const own = latestRelevantMessage();
    if (own && own.senderRoleId === roleSel.id) dismissedMessageId = own.id;
    render();
    showStatus("Sent");
  } catch (_) {
    showStatus("Couldn't send — check the connection");
  } finally {
    el.send.disabled = false;
  }
});

let clearArmed = null;

el.clear.addEventListener("click", async () => {
  if (!clearArmed) {
    el.clear.textContent = "Confirm clear?";
    showStatus("Deletes every message on every device — press again");
    clearArmed = setTimeout(disarmClear, 5000);
    return;
  }
  disarmClear();

  el.clear.disabled = true;
  try {
    await post("/v1/messages", { method: "DELETE" });
    dismissedMessageId = null;
    render();
    showStatus("History cleared");
  } catch (_) {
    showStatus("Couldn't clear — check the connection");
  } finally {
    el.clear.disabled = false;
  }
});

function disarmClear() {
  clearTimeout(clearArmed);
  clearArmed = null;
  el.clear.textContent = "Clear History";
}

applyControlVisibility();

el.openChat.addEventListener("click", () => {
  el.chat.classList.remove("hidden");
  el.chatLog.dataset.signature = "";
  renderChat();
  el.composeText.focus();
});

el.closeChat.addEventListener("click", () => el.chat.classList.add("hidden"));

el.openSettings.addEventListener("click", () => {
  renderCueButtons();
  renderConnection();
  el.settings.classList.remove("hidden");
});

el.closeSettings.addEventListener("click", () => el.settings.classList.add("hidden"));

el.settings.addEventListener("click", (event) => {
  if (event.target === el.settings) el.settings.classList.add("hidden");
});

for (const button of document.querySelectorAll("[data-cue-display]")) {
  button.addEventListener("click", () => {
    setCueDisplay(parseCueDisplay(button.dataset.cueDisplay) || "outline", true);
    if (snapshot) render();
  });
}

el.chat.addEventListener("click", (event) => {
  if (event.target === el.chat) el.chat.classList.add("hidden");
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    el.chat.classList.add("hidden");
    el.settings.classList.add("hidden");
  }
});

async function dismissStanding() {
  const message = activeNotification();
  if (!message) return;
  dismissedMessageId = message.id;
  render();
  try {
    await post("/v1/messages/dismiss", { method: "POST" });
    showStatus("Notification cleared");
  } catch (_) {
    dismissedMessageId = null;
    render();
    showStatus("Couldn't clear — check the connection");
  }
}

el.ptMessage.addEventListener("click", dismissStanding);
el.lsMessage.addEventListener("click", dismissStanding);

wakeLock.acquire();
fetchOnce();
fetchProducerName();
link.connect();
</script>
</body>
</html>
