<!doctype html>
<html lang="en" data-cue="OFF" data-layout="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>13 Years Pager</title>
<!--
  The browser pager — the app's fourth pager platform, after iPhone/iPad
  (HostPagerView), Apple Watch (WatchCueView) and the ESP32 panel.

  Served by the Producer's own Control API listener at `/pager` (see
  WebPager.swift) and fed by the same `/v1/socket` push every other control
  surface uses, so a cue lands here at the same moment it lands on a phone.
  Deliberately one self-contained file: the HTTP server this is served from
  is a deliberately minimal one (see HTTPMessage.swift), and a pager that
  needs four round trips before it can paint is a pager that shows a white
  screen on a flaky venue network at the exact moment it matters.

  It displays everything the other pagers display — cues, the running item,
  notes, the latest message — and writes exactly one thing back: messages.
  Sending and clearing go through the same engine calls the phone pager's
  own chat does, and a pager writes only to its own thread with the
  Producer. Nothing here fires a cue or touches the plan; anything that
  changes the show stays with the surfaces that are meant to (the Producer
  app, the REST/WebSocket API).

  Query parameters:
    ?role=<id|name>   which role's cue to show (case-insensitive; the name
                      as typed in the Producer works, so
                      `?role=Front%20of%20House` is a valid bookmark).
                      Wins over whatever was last picked in this browser.
    ?layout=auto      the default: standard below, lower third on a short,
            standard  wide viewport.
            lowerthird
-->
<style>
  /* Cue colors are CueState.swift's, to the byte — the ESP32 panel's
     cue_state.h documents its two deliberate deviations from these; this
     one has none, since a browser has no panel to compensate for. */
  :root {
    --cue-off-bg: #141a26;
    --cue-off-fg: #ffffff;
    --cue-standby-bg: #f5b826;
    --cue-standby-fg: #1a1a1a;
    --cue-go-bg: #26c759;
    --cue-go-fg: #ffffff;

    /* One scale step every size below is a multiple of, so the page is
       resolution-independent rather than responsive-with-breakpoints: a
       pager on a phone, a 4K lobby display and an OBS browser source are
       the same layout at three sizes. Height-led (a pager is read at a
       glance from across a room, so it should fill the screen) but capped
       against width, or a wide-and-short window would overflow. */
    --s: min(1.2vh, 2.2vw);

    --bg: var(--cue-off-bg);
    --fg: var(--cue-off-fg);
  }

  [data-cue="STANDBY"], [data-cue="FLASH_STANDBY"] {
    --bg: var(--cue-standby-bg);
    --fg: var(--cue-standby-fg);
  }
  [data-cue="GO"], [data-cue="FLASH_GO"] {
    --bg: var(--cue-go-bg);
    --fg: var(--cue-go-fg);
  }
  /* FLASH_STANDBY / FLASH_GO read as their base state and do not blink —
     the same call HostPagerView and the ESP32 firmware make. If a blink
     ever lands, it lands in all three at once. */

  /* The app's own typeface, served out of the app's own bundle: the same
     six static weights `Font.inter(size:weight:)` maps to, so a weight
     here resolves to the same file the phone pager draws with instead of
     being synthesized from a neighbour. */
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Medium.ttf") format("truetype");
    font-weight: 500; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 600; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Bold.ttf") format("truetype");
    font-weight: 700; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-ExtraBold.ttf") format("truetype");
    font-weight: 800; font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/pager/fonts/Inter-Black.ttf") format("truetype");
    font-weight: 900; font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    /* Inter's "zero" feature — a slashed zero, which `Font.inter` switches
       on app-wide and the ESP32's bitmap fonts bake in at build time. A
       countdown is mostly digits; this is the difference between the web
       pager looking like the other pagers and looking like a web page. */
    font-feature-settings: "zero" 1;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* A cue change is instant on every other pager — the color IS the
       signal, and easing it would be lying about when the cue landed. */
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; }

  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .hidden { display: none !important; }

  /* Digits that don't dance as they count down. */
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "zero" 1; }

  /* ---------------------------------------------------------------
     Standard layout — the same furniture, in the same order, as
     HostPagerView: role bar, huge state word, the running item with its
     countdown, assigned note panels, latest message.
     --------------------------------------------------------------- */

  #standard {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: calc(2 * var(--s));
    padding: calc(2 * var(--s)) calc(2.5 * var(--s));
    min-height: 0;
    /* A column, centered, rather than furniture stretched the full width of
       whatever monitor this landed on — the phone pager's proportions are
       the ones everyone on the team already reads at a glance. */
    width: min(100%, calc(80 * var(--s)));
    margin: 0 auto;
  }

  .rolebar {
    display: flex;
    align-items: center;
    gap: calc(1.5 * var(--s));
    flex: 0 0 auto;
  }

  /* Appearance stripped on purpose: a native select paints its own
     background and text color, which ignores the cue palette entirely and
     renders dark-on-dark the moment the cue is Clear. */
  /* The chevron is drawn here rather than left to the select, whose own
     appearance had to go (see below). Mirrors the phone pager's role Menu,
     which is a name with a `chevron.down` beside it. */
  .rolepick {
    position: relative;
    display: inline-flex;
    align-items: center;
    max-width: 60%;
    font-size: calc(1.8 * var(--s));
  }

  .rolepick::after {
    content: "";
    position: absolute;
    right: calc(1.2 * var(--s));
    width: 0.4em;
    height: 0.4em;
    border-right: 0.12em solid currentColor;
    border-bottom: 0.12em solid currentColor;
    transform: translateY(-25%) rotate(45deg);
    pointer-events: none;
    opacity: 0.75;
  }

  /* One role is nothing to pick between, so there's no menu to point at. */
  .rolepick.single::after { display: none; }

  #role {
    font: inherit;
    font-size: 1em;
    font-weight: 700;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.22);
    border: 0;
    border-radius: calc(0.9 * var(--s));
    padding: calc(0.7 * var(--s)) calc(3.2 * var(--s)) calc(0.7 * var(--s)) calc(1.4 * var(--s));
    max-width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  /* One role means nothing to pick between — the picker reads as a plain
     label then, matching the phone pager, which shows the name either way. */
  #role:disabled { opacity: 1; }
  /* The open dropdown is drawn by the OS, not by this page. */
  #role option { color: #111; background: #fff; }

  .link {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: calc(0.6 * var(--s));
    font-size: calc(1.35 * var(--s));
    font-weight: 600;
    opacity: 0.8;
  }
  .dot {
    width: calc(1 * var(--s));
    height: calc(1 * var(--s));
    border-radius: 50%;
    background: #ff3b30;
  }
  .link[data-live="1"] .dot { background: #30d158; }

  .stage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(1.4 * var(--s));
    min-height: 0;
  }

  #cueWord {
    /* Capped against width as well as the scale step: "STANDBY" is the
       longest of the three words and shouldn't touch the edges on a narrow
       phone — the same job HostPagerView's `.minimumScaleFactor(0.5)` does. */
    font-size: min(calc(9 * var(--s)), 17vw);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-align: center;
  }

  #person {
    font-size: calc(2 * var(--s));
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.8;
  }

  #itemCard {
    flex: 0 0 auto;
    align-self: center;
    text-align: center;
    background: rgba(0, 0, 0, 0.25);
    border-radius: calc(2 * var(--s));
    padding: calc(2 * var(--s)) calc(3 * var(--s));
    max-width: 100%;
  }

  #itemTitle {
    font-size: calc(2 * var(--s));
    font-weight: 700;
    /* Two lines, then ellipsis — HostPagerView's `.lineLimit(2)`. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #itemCard[data-header="1"] #itemTitle { font-size: calc(2.8 * var(--s)); }

  #countdown {
    font-size: calc(6.8 * var(--s));
    font-weight: 900;
    line-height: 1.05;
    margin-top: calc(0.6 * var(--s));
  }

  #duration {
    font-size: calc(1.35 * var(--s));
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.6;
  }

  #notes {
    flex: 0 1 auto;
    display: flex;
    flex-direction: column;
    gap: calc(1.2 * var(--s));
    overflow: hidden;
  }

  .note {
    background: rgba(0, 0, 0, 0.18);
    border-radius: calc(1.5 * var(--s));
    padding: calc(1.2 * var(--s)) calc(2 * var(--s));
  }
  .note[data-current="1"] { background: rgba(0, 0, 0, 0.3); }

  .note-label {
    font-size: calc(1.35 * var(--s));
    font-weight: 900;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }
  .note-text {
    font-size: calc(1.85 * var(--s));
    font-weight: 500;
    margin-top: calc(0.4 * var(--s));
  }
  .note[data-current="1"] .note-text { font-size: calc(2.2 * var(--s)); font-weight: 700; }

  #banner {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: calc(1.2 * var(--s));
    background: #ffd60a;
    color: #000;
    border-radius: calc(1.5 * var(--s));
    padding: calc(1.4 * var(--s)) calc(2 * var(--s));
    font-size: calc(2.2 * var(--s));
    font-weight: 700;
    cursor: pointer;
    /* The banner is yellow on a background that is also yellow while a
       Standby cue is up — the phone pager leans on a shadow to separate
       the two, and so does this. */
    box-shadow: 0 calc(0.3 * var(--s)) calc(1 * var(--s)) rgba(0, 0, 0, 0.35);
  }
  #banner::before { content: "💬"; font-size: calc(2 * var(--s)); }

  /* The way into the thread. Mirrors the phone pager, which always offers
     a way to reach the Producer rather than only a reply to something
     already sent. What's standing is the banner above; clearing it is the
     banner too. */
  #notifyBar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: calc(1 * var(--s));
  }

  #notifyBar button, #chatHead button, #compose button {
    font: inherit;
    font-size: calc(1.5 * var(--s));
    font-weight: 700;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.3);
    border: 0;
    border-radius: calc(1.2 * var(--s));
    padding: calc(0.9 * var(--s)) calc(1.8 * var(--s));
    cursor: pointer;
    white-space: nowrap;
  }

  #notifyBar button:hover:not(:disabled),
  #chatHead button:hover:not(:disabled),
  #compose button:hover:not(:disabled) { background: rgba(0, 0, 0, 0.42); }

  #notifyBar button:disabled, #compose button:disabled { opacity: 0.4; cursor: default; }

  /* The chat overlay — the same "one merged timeline, tagged EVERYONE or
     DIRECT" screen `PagerChatView` gives the phone, over the cue color
     rather than in a sheet. */
  #chat {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(2 * var(--s));
    background: rgba(0, 0, 0, 0.45);
  }

  #chatCard {
    display: flex;
    flex-direction: column;
    width: min(100%, calc(70 * var(--s)));
    max-height: 100%;
    background: var(--bg);
    border-radius: calc(2 * var(--s));
    box-shadow: 0 calc(1 * var(--s)) calc(3 * var(--s)) rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  #chatHead {
    display: flex;
    align-items: center;
    gap: calc(1 * var(--s));
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    border-bottom: 1px solid rgba(0, 0, 0, 0.25);
  }

  #chatTitle {
    flex: 1 1 auto;
    font-size: calc(2.2 * var(--s));
    font-weight: 900;
  }

  #chatLog {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    display: flex;
    flex-direction: column;
    gap: calc(1.2 * var(--s));
  }

  .msg {
    background: rgba(0, 0, 0, 0.22);
    border-radius: calc(1.4 * var(--s));
    padding: calc(1.1 * var(--s)) calc(1.5 * var(--s));
    max-width: 85%;
  }

  /* This role's own replies, on the right — the phone pager tags each row
     the same way rather than relying on the side alone. */
  .msg.own { align-self: flex-end; background: rgba(0, 0, 0, 0.35); }

  .msg-meta {
    font-size: calc(1.1 * var(--s));
    font-weight: 900;
    letter-spacing: 0.1em;
    opacity: 0.6;
  }

  .msg-text {
    font-size: calc(1.7 * var(--s));
    font-weight: 600;
    margin-top: calc(0.3 * var(--s));
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .msg-empty { opacity: 0.6; font-size: calc(1.6 * var(--s)); font-weight: 600; }

  #compose {
    flex: 0 0 auto;
    display: flex;
    gap: calc(1 * var(--s));
    align-items: stretch;
    padding: calc(1.6 * var(--s)) calc(2 * var(--s));
    border-top: 1px solid rgba(0, 0, 0, 0.25);
  }

  #composeText {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: calc(1.8 * var(--s));
    font-weight: 600;
    color: var(--fg);
    background: rgba(0, 0, 0, 0.22);
    border: 0;
    border-radius: calc(1.2 * var(--s));
    padding: calc(1 * var(--s)) calc(1.6 * var(--s));
  }

  #composeText::placeholder { color: var(--fg); opacity: 0.5; }
  #composeText:focus { outline: calc(0.25 * var(--s)) solid rgba(0, 0, 0, 0.35); }

  #composeStatus {
    flex: 0 0 auto;
    font-size: calc(1.35 * var(--s));
    font-weight: 700;
    opacity: 0.8;
    padding: 0 calc(0.5 * var(--s));
  }

  /* ---------------------------------------------------------------
     Lower third — a single strip for a short, wide viewport (an OBS
     browser source, a ribbon display above a stage):

       [ current time ---- current element ---- countdown ]

     Same cue color as the standard layout, because on a pager the color
     is the cue; only the furniture changes.
     --------------------------------------------------------------- */

  #lowerthird {
    flex: 1;
    /* The three fields are positioned, not flowed: the element name has to
       sit on the strip's true centerline, and in a flex row it would sit on
       the centerline of whatever the clock and countdown left over — which
       is off-center by half the difference between them, and moves every
       time the countdown loses a digit. */
    position: relative;
    display: flex;
    align-items: center;
    /* No padding here — the three fields are positioned, and each one's
       own inset is set from JS to match the space above and below the
       type (see `layoutLowerThird`). */
    padding: 0;
    /* Height-led: the strip fills whatever band it's given, capped against
       width so a very wide, very short source doesn't overrun. Everything
       inside is sized in `em` off this one number. */
    /* Sized to fill the band: a lower third is usually cropped to exactly
       the strip it occupies, so air above and below the type is wasted
       height, not breathing room.
       The height term is capped at 62vh because a reading plus its caption
       stands about 1.5em tall — past that the block starts overflowing a
       short strip. The width term is what actually binds on a typical
       16:1 strip, and it's deliberately not larger: the clock grows with
       it, and the clock's width is taken out of the centered name's budget
       twice over (see `layoutLowerThird`). */
    font-size: min(62vh, 6.8vw);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  #ltClock {
    position: absolute;
    /* Zero against the padding edge — the inset itself is the strip's
       padding, so the two can't double up. */
    left: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    /* Full size, matching the countdown: the two readings are a pair and
       should carry the same weight on the strip. It costs the centered
       name width — the clock is the wider of the two fields, and whichever
       is wider is reserved on both sides to keep the name on the
       centerline (see `layoutLowerThird`) — which is what the name's
       shrink-to-fit is there to absorb. */
    font-size: 1em;
    font-weight: 900;
  }

  #ltCountdown {
    position: absolute;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font-weight: 900;
  }

  /* The caption under each reading: TIME under the clock, and
     PROJECTED/ACTUAL under the countdown — read-only here, exactly as in
     the standard layout, where the pager displays that flag and doesn't
     toggle it. */
  .lt-tag {
    font-size: 0.26em;
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0.6;
    margin-top: 0.25em;
  }

  /* Centered on the strip, with the room it may take set from JS (see
     `layoutLowerThird`) so it can never run under the fields on either
     side. In message mode it's re-anchored to the left instead and given
     everything up to the countdown.
     The dark panel is the standard layout's item card, at this scale. */
  #ltTitle {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-weight: 900;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 0.2em;
  }

  /* A message takes the clock's place as well as the name's — the countdown
     is the one thing that stays, because it's the only field on this strip
     nobody can reconstruct for themselves. Same yellow card the standard
     layout puts a message in. */
  #lowerthird.message #ltClock { display: none; }

  #lowerthird.message #ltTitle {
    background: #ffd60a;
    color: #000;
    box-shadow: 0 0.02em 0.06em rgba(0, 0, 0, 0.35);
  }

  /* A disconnected pager says so in both layouts rather than silently
     showing a cue that may already be stale. */
  #offline {
    position: fixed;
    left: 50%;
    bottom: calc(1.5 * var(--s));
    transform: translateX(-50%);
    font-size: calc(1.4 * var(--s));
    font-weight: 700;
    letter-spacing: 0.08em;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    border-radius: 999px;
    padding: calc(0.6 * var(--s)) calc(1.6 * var(--s));
  }
  [data-layout="lowerthird"] #offline { font-size: min(9vh, 1.6vw); bottom: 2vh; }
</style>
</head>
<body>
  <div id="app">
    <div id="standard">
      <div class="rolebar">
        <span class="rolepick" id="rolepick">
          <select id="role" aria-label="Role"></select>
        </span>
        <span class="link" id="link"><span class="dot"></span><span id="linkLabel">Connecting…</span></span>
      </div>

      <div class="stage">
        <div id="cueWord">CLEAR</div>
        <div id="person" class="hidden"></div>
      </div>

      <div id="itemCard" class="hidden">
        <div id="itemTitle"></div>
        <div id="countdown" class="tnum"></div>
        <div id="duration"></div>
      </div>

      <div id="notes"></div>

      <div id="banner" class="hidden" title="Clear this notification everywhere (the message stays in the thread)"></div>

      <div id="notifyBar">
        <button id="openChat" type="button">Messages</button>
      </div>
      <div id="composeStatus" class="hidden"></div>
    </div>

    <div id="chat" class="hidden" role="dialog" aria-label="Messages">
      <div id="chatCard">
        <div id="chatHead">
          <span id="chatTitle">Messages</span>
          <button id="clear" type="button" title="Clear the message history on every device">Clear History</button>
          <button id="closeChat" type="button">Done</button>
        </div>
        <div id="chatLog"></div>
        <form id="compose" autocomplete="off">
          <input id="composeText" type="text" placeholder="Message the producer…" aria-label="Message the producer">
          <button id="send" type="submit">Send</button>
        </form>
      </div>
    </div>

    <div id="lowerthird" class="hidden">
      <span id="ltClock" class="tnum">
        <span id="ltClockValue"></span>
        <span id="ltClockLabel" class="lt-tag">LOCAL TIME</span>
      </span>
      <span id="ltTitle">—</span>
      <span id="ltCountdown" class="tnum">
        <span id="ltCountdownValue">--:--</span>
        <span id="ltDuration" class="lt-tag">PROJECTED</span>
      </span>
    </div>

    <div id="offline" class="hidden">RECONNECTING…</div>
  </div>

<script>
"use strict";

// ---------------------------------------------------------------------
// Options
// ---------------------------------------------------------------------

const params = new URLSearchParams(location.search);

// The role this pager is for. A bookmark is the whole point — a host's
// tablet, a camera op's second monitor and a lower third over the stage are
// three different roles on three different URLs — so the parameter takes
// precedence over whatever this browser last had picked, every load.
const ROLE_PARAM = (params.get("role") || "").trim();

// `auto` (default) picks per viewport; the explicit values are for a
// browser source whose canvas isn't the shape its content is (OBS at
// 1920x1080 showing a strip, say).
const LAYOUT_PARAM = (params.get("layout") || "auto").toLowerCase().replace(/[^a-z]/g, "");

const ROLE_STORAGE_KEY = "13years.webpager.role";

// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------

/** Last snapshot from `hello`/`state`, and when it landed (for the local tick). */
let snapshot = null;
let snapshotAt = 0;
/// The Producer's own device name, off `GET /v1/health` — the same thing
/// `HostPagerView` shows beside its green dot. It isn't in the state
/// snapshot, and it never changes for the life of a connection, so it's
/// fetched once rather than carried on every push.
let producerName = "";
let selectedRoleId = ROLE_PARAM || readStoredRole() || "";
/** Id of the message the banner was dismissed for — HostPagerView's `dismissedMessageId`. */
let dismissedMessageId = null;
let socket = null;
let reconnectDelay = 500;

const root = document.documentElement;

const el = {
  standard: document.getElementById("standard"),
  lowerthird: document.getElementById("lowerthird"),
  role: document.getElementById("role"),
  rolepick: document.getElementById("rolepick"),
  link: document.getElementById("link"),
  linkLabel: document.getElementById("linkLabel"),
  cueWord: document.getElementById("cueWord"),
  person: document.getElementById("person"),
  itemCard: document.getElementById("itemCard"),
  itemTitle: document.getElementById("itemTitle"),
  countdown: document.getElementById("countdown"),
  duration: document.getElementById("duration"),
  notes: document.getElementById("notes"),
  banner: document.getElementById("banner"),
  notifyBar: document.getElementById("notifyBar"),
  openChat: document.getElementById("openChat"),
  chat: document.getElementById("chat"),
  chatLog: document.getElementById("chatLog"),
  closeChat: document.getElementById("closeChat"),
  compose: document.getElementById("compose"),
  composeText: document.getElementById("composeText"),
  send: document.getElementById("send"),
  clear: document.getElementById("clear"),
  composeStatus: document.getElementById("composeStatus"),
  ltClock: document.getElementById("ltClock"),
  ltClockValue: document.getElementById("ltClockValue"),
  ltTitle: document.getElementById("ltTitle"),
  ltCountdown: document.getElementById("ltCountdown"),
  ltCountdownValue: document.getElementById("ltCountdownValue"),
  ltDuration: document.getElementById("ltDuration"),
  offline: document.getElementById("offline"),
};

function readStoredRole() {
  try { return localStorage.getItem(ROLE_STORAGE_KEY); } catch (_) { return null; }
}

function storeRole(id) {
  try { localStorage.setItem(ROLE_STORAGE_KEY, id); } catch (_) { /* private mode */ }
}

// ---------------------------------------------------------------------
// Layout
// ---------------------------------------------------------------------

// What "a lower third resolution" means in a browser that only knows its
// own viewport: a band far wider than it is tall. Either test alone has a
// false positive — a phone in landscape is 2.2:1, a small floating window
// is short but square-ish — so it takes both a genuinely short viewport or
// a genuinely extreme ratio.
function isLowerThirdViewport() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  return h <= 400 || w / h >= 3;
}

function applyLayout() {
  let layout;
  if (LAYOUT_PARAM === "lowerthird" || LAYOUT_PARAM === "third") {
    layout = "lowerthird";
  } else if (LAYOUT_PARAM === "standard" || LAYOUT_PARAM === "full") {
    layout = "standard";
  } else {
    layout = isLowerThirdViewport() ? "lowerthird" : "standard";
  }
  root.dataset.layout = layout;
  el.standard.classList.toggle("hidden", layout !== "standard");
  el.lowerthird.classList.toggle("hidden", layout !== "lowerthird");
  // The layout that was hidden hasn't been rendered since it was hidden —
  // on a fresh load that's the placeholder markup, and waiting for the next
  // snapshot to fix it means up to a second of "--:--" after a resize.
  if (snapshot) render();
}

window.addEventListener("resize", applyLayout);
applyLayout();

// ---------------------------------------------------------------------
// Formatting — mirrors TimeFormatting.string(forSeconds:threshold:)
// ---------------------------------------------------------------------

function thresholdSeconds() {
  switch (snapshot && snapshot.settings && snapshot.settings.hourFormatThreshold) {
    case "over60Minutes": return 3600;
    case "never": return null;
    default: return 5400; // over90Minutes, the app's own default
  }
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatDuration(totalSeconds) {
  const cutoff = thresholdSeconds();
  const abs = Math.abs(totalSeconds);
  let core;
  if (cutoff !== null && abs >= cutoff) {
    core = Math.floor(abs / 3600) + ":" + pad(Math.floor(abs / 60) % 60) + ":" + pad(abs % 60);
  } else {
    core = pad(Math.floor(abs / 60)) + ":" + pad(abs % 60);
  }
  // Negative is overtime, not a negative duration — same as the app.
  return totalSeconds < 0 ? "+" + core : core;
}

/// The wall clock, with seconds, at the countdown's own size — the two
/// readings are a pair.
///
/// It is the widest field on the strip by some way, and because the
/// centered name reserves the wider of the two side fields on *both*
/// sides to stay on the true centerline, every pixel here costs the name
/// two. That's the trade: two big readings, and a name that shrinks to
/// fit what they leave.
function formatClock(date) {
  return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
}

// ---------------------------------------------------------------------
// Derivation — mirrors PagerPresentationState
// ---------------------------------------------------------------------

function roles() { return (snapshot && snapshot.roles) || []; }

function activeRole() {
  const list = roles();
  return list.find((r) => r.id === selectedRoleId) || list[0] || null;
}

function currentCue() {
  const role = activeRole();
  return (role && role.state) || "OFF";
}

function cueWord(state) {
  if (state === "STANDBY" || state === "FLASH_STANDBY") return "STANDBY";
  if (state === "GO" || state === "FLASH_GO") return "GO!";
  return "CLEAR";
}

function activeItem() {
  return (snapshot && snapshot.timer && snapshot.timer.item) || null;
}

function nextItem() {
  if (!snapshot) return null;
  const items = snapshot.plan.items || [];
  return items[snapshot.plan.activeItemIndex + 1] || null;
}

function notesFor(item) {
  const role = activeRole();
  const categories = (role && role.assignedNoteCategories) || [];
  if (!item || !item.notes) return [];
  return categories
    .map((category) => ({ category, text: item.notes[category] }))
    .filter((note) => note.text);
}

function latestRelevantMessage() {
  if (!snapshot) return null;
  // `messages` is newest-first, so the first match is the latest one.
  return (snapshot.messages || []).find(
    (m) => !m.targetRoleId || m.targetRoleId === selectedRoleId
  ) || null;
}

/** Remaining seconds, ticked forward locally between snapshots. */
function remainingSeconds() {
  if (!snapshot || !snapshot.timer) return null;
  const timer = snapshot.timer;
  if (!timer.isRunning) return timer.remainingSeconds;
  const elapsed = (Date.now() - snapshotAt) / 1000;
  return Math.round(timer.remainingSeconds - elapsed);
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------

function renderRoles() {
  const list = roles();
  const role = activeRole();
  if (role && role.id !== selectedRoleId) {
    // The selected role was deleted (or this pager was pointed at a name
    // that doesn't exist) and `activeRole` fell back to the first one —
    // adopt it, so the picker and the cue can't disagree.
    selectedRoleId = role.id;
  }

  const signature = list.map((r) => r.id + ":" + r.name).join("|");
  if (el.role.dataset.signature !== signature) {
    el.role.dataset.signature = signature;
    el.role.innerHTML = "";
    for (const r of list) {
      const option = document.createElement("option");
      option.value = r.id;
      option.textContent = r.name;
      el.role.appendChild(option);
    }
  }
  el.role.value = selectedRoleId;
  el.role.disabled = list.length < 2;
  el.rolepick.classList.toggle("single", list.length < 2);
}

function renderStandard() {
  const role = activeRole();
  const item = activeItem();

  el.cueWord.textContent = cueWord(currentCue());

  const person = role && role.personName;
  el.person.textContent = person ? "FOR: " + person.toUpperCase() : "";
  el.person.classList.toggle("hidden", !person);

  el.itemCard.classList.toggle("hidden", !item);
  if (item) {
    const isHeader = (item.itemType || "").toLowerCase() === "header";
    el.itemCard.dataset.header = isHeader ? "1" : "0";
    el.itemTitle.textContent = (item.title || "").toUpperCase();
    // Headers are section dividers with no meaningful duration — no
    // countdown, same as every other pager.
    el.countdown.classList.toggle("hidden", isHeader);
    el.duration.classList.toggle("hidden", isHeader);
    if (!isHeader) {
      el.countdown.textContent = formatDuration(remainingSeconds() || 0);
      el.duration.textContent = snapshot.timer.isDurationActualForDisplay ? "ACTUAL" : "PROJECTED";
    }
  }

  const current = notesFor(item);
  const next = notesFor(nextItem());
  const panels = [
    ...current.map((n) => ({ ...n, current: true, multiple: current.length > 1 })),
    ...next.map((n) => ({ ...n, current: false, multiple: next.length > 1 })),
  ];
  const notesSignature = panels.map((p) => p.current + p.category + p.text).join("|");
  if (el.notes.dataset.signature !== notesSignature) {
    el.notes.dataset.signature = notesSignature;
    el.notes.innerHTML = "";
    for (const panel of panels) {
      const base = panel.current ? "CURRENT" : "NEXT";
      const node = document.createElement("div");
      node.className = "note";
      node.dataset.current = panel.current ? "1" : "0";
      const label = document.createElement("div");
      label.className = "note-label";
      label.textContent = panel.multiple ? base + " — " + panel.category.toUpperCase() : base;
      const text = document.createElement("div");
      text.className = "note-text";
      text.textContent = panel.text;
      node.append(label, text);
      el.notes.appendChild(node);
    }
  }

  const notification = activeNotification();
  el.banner.classList.toggle("hidden", !notification);
  if (notification) el.banner.textContent = notification.text;
}

function renderLowerThird() {
  const item = activeItem();
  const message = activeNotification();

  el.lowerthird.classList.toggle("message", message !== null);
  el.ltClockValue.textContent = formatClock(new Date());
  if (message) {
    // No glyph, unlike the standard layout's banner: at this size the card
    // taking over the strip is already unmistakably a message, and the
    // glyph only costs the text width.
    el.ltTitle.textContent = message.text;
  } else {
    el.ltTitle.textContent = item ? item.title : (snapshot && snapshot.plan && snapshot.plan.title) || "—";
  }

  const isHeader = item && (item.itemType || "").toLowerCase() === "header";
  const remaining = remainingSeconds();
  const hasCountdown = Boolean(item) && !isHeader && remaining !== null;
  el.ltCountdownValue.textContent = hasCountdown ? formatDuration(remaining) : "--:--";
  el.ltDuration.classList.toggle("hidden", !hasCountdown);
  if (hasCountdown) {
    el.ltDuration.textContent = snapshot.timer.isDurationActualForDisplay ? "ACTUAL" : "PROJECTED";
  }

  fitTitle(layoutLowerThird(message !== null));
}

/// The message currently standing as a notification, or `null`.
///
/// "Standing" is the Producer's state, not this page's: a message notifies
/// until someone clears the notification (here, on another web pager, or in
/// the Producer app's Messages section), which is a different act from
/// deleting the thread. `notificationsClearedAt` in the snapshot is where
/// that line sits — see `CueEngine.notificationsClearedAt`.
///
/// It replaced a 30-second timer that used to take a lower third down on
/// its own. A timer is the wrong instrument: the producer is the one who
/// knows whether the host has read it.
function activeNotification() {
  const message = latestRelevantMessage();
  if (!message || message.id === dismissedMessageId) return null;
  const cutoff = snapshot && snapshot.notificationsClearedAt;
  if (cutoff && Date.parse(message.timestamp) <= Date.parse(cutoff)) return null;
  return message;
}

/// Positions the centered field and reports how wide it may be.
///
/// Normal: the clock and the countdown reserve the same width as each other
/// (whichever is wider), so what's left is symmetric about the strip's
/// centerline and the name sits on it. Message mode: the clock is gone, so
/// the text gets everything up to the countdown.
function layoutLowerThird(isMessage) {
  const strip = el.lowerthird;

  // Match the side inset to the space centering leaves above and below the
  // tallest reading, so the type sits the same distance from all four
  // edges. Measured rather than declared: the vertical gap is whatever the
  // band height minus the block height happens to be, and that changes
  // with every source size.
  //
  // Applied as each field's own offset, not as padding on the strip: these
  // three are absolutely positioned, and an absolutely positioned child is
  // laid out against its container's *padding box* — padding would inset
  // the box it's measured from by exactly nothing.
  const blockHeight = Math.max(el.ltClock.offsetHeight, el.ltCountdown.offsetHeight);
  const inset = Math.max((strip.clientHeight - blockHeight) / 2, 0);
  el.ltClock.style.left = inset + "px";
  el.ltCountdown.style.right = inset + "px";

  const style = getComputedStyle(strip);
  const pad = inset;
  const gap = parseFloat(style.fontSize) * 0.25;
  const inner = strip.clientWidth - pad * 2;
  const countdown = el.ltCountdown.offsetWidth;
  const base = parseFloat(style.fontSize);
  const padX = base * 0.22;
  const padY = base * 0.12;
  el.ltTitle.style.padding = padY + "px " + padX + "px";

  let available;
  if (isMessage) {
    available = inner - countdown - gap;
    el.ltTitle.style.left = pad + "px";
    el.ltTitle.style.transform = "none";
    el.ltTitle.style.width = Math.max(available, 0) + "px";
  } else {
    const side = Math.max(el.ltClock.offsetWidth, countdown);
    available = inner - (side + gap) * 2;
    el.ltTitle.style.left = "50%";
    el.ltTitle.style.transform = "translateX(-50%)";
    el.ltTitle.style.width = "";
  }
  available = Math.max(available, 0);
  el.ltTitle.style.maxWidth = available + "px";
  // What the text itself gets: the panel is border-box, so its padding
  // comes out of the same budget.
  return Math.max(available - padX * 2, 0);
}

/// The element name (or a message) is the one thing this strip exists to
/// show, so it shrinks to fit the room the other fields leave, down to a
/// floor, and only then falls back to the CSS ellipsis.
///
/// Measured against an off-screen copy rather than by comparing the live
/// node's `scrollWidth` to its `clientWidth`: `text-overflow: ellipsis`
/// clips the text to the box before either is reported, so the usual
/// "is this truncated?" test reads exactly equal on text that is very much
/// truncated. The copy carries the same font and no box to clip to, so its
/// width is the width the text actually wants.
const measurer = document.createElement("span");
measurer.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;";
document.body.appendChild(measurer);

let lastFit = "";
let fittedSize = "";

/// `available` comes from `layoutLowerThird`, which knows how much room the
/// clock and the countdown left — the node's own width can't be asked,
/// because the node is what's being sized.
function fitTitle(available) {
  const node = el.ltTitle;
  node.style.fontSize = "";
  const style = getComputedStyle(node);
  const base = parseFloat(style.fontSize);
  const key = node.textContent + "@" + Math.round(available) + "@" + Math.round(base);
  if (key === lastFit) {
    node.style.fontSize = fittedSize;
    return;
  }
  lastFit = key;

  measurer.style.fontFamily = style.fontFamily;
  measurer.style.fontWeight = style.fontWeight;
  measurer.style.letterSpacing = style.letterSpacing;
  measurer.style.fontSize = base + "px";
  measurer.textContent = node.textContent;

  const needed = measurer.offsetWidth;
  // A hair under an exact fit: measured and rendered widths agree to about
  // a pixel, and landing exactly on the box is what puts an ellipsis on
  // text that technically fits.
  fittedSize = needed > available && needed > 0
    ? Math.max(base * 0.3, (base * available * 0.98) / needed) + "px"
    : "";
  node.style.fontSize = fittedSize;
}

function render() {
  if (!snapshot) return;
  root.dataset.cue = currentCue();
  renderRoles();
  updateSendEnabled();
  renderChat();
  if (root.dataset.layout === "lowerthird") {
    renderLowerThird();
  } else {
    renderStandard();
  }
}

/// The Producer pushes on change, and a show sitting on a paused timer
/// changes nothing for minutes at a stretch — so silence is not evidence of
/// a dead link, and a pager that treated it that way sat there saying
/// "Reconnecting…" through a perfectly healthy service.
///
/// Every other pager answers this by asking: the Watch polls `/v1/state` at
/// 1 Hz whether or not anything moved. This one does the same, just at a
/// lower rate, because the socket already covers the moment-to-moment case
/// — the ask is what proves the link is still there when nothing is
/// happening, and what catches a socket that is open but no longer carrying
/// anything.
const HEARTBEAT_MS = 2000;
/// Three missed asks. Below that, a single slow response would flap the
/// indicator on a busy network.
const STALE_AFTER_MS = 6500;

/// Everything relevant to this role: Everyone broadcasts plus this role's
/// own thread with the Producer, merged into one timeline and tagged, the
/// way `PagerChatView` does it for the phone (a pager gets one screen, not
/// separate Everyone and DM tabs like the Producer's `MessagesView`).
function threadMessages() {
  if (!snapshot) return [];
  return (snapshot.messages || [])
    .filter((m) => !m.targetRoleId || m.targetRoleId === selectedRoleId)
    .slice()
    .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp));
}

function renderChat() {
  if (el.chat.classList.contains("hidden")) return;
  const messages = threadMessages();
  const signature = messages.map((m) => m.id).join("|") + "@" + selectedRoleId;
  if (el.chatLog.dataset.signature === signature) return;
  const wasAtBottom = el.chatLog.scrollTop + el.chatLog.clientHeight >= el.chatLog.scrollHeight - 40;
  el.chatLog.dataset.signature = signature;
  el.chatLog.innerHTML = "";

  if (messages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "msg-empty";
    empty.textContent = "No messages yet";
    el.chatLog.appendChild(empty);
    return;
  }

  for (const message of messages) {
    const own = message.senderRoleId === selectedRoleId;
    const node = document.createElement("div");
    node.className = own ? "msg own" : "msg";

    const meta = document.createElement("div");
    meta.className = "msg-meta";
    const scope = message.targetRoleId ? "DIRECT" : "EVERYONE";
    meta.textContent = scope + " · " + (message.sender || "Producer") + " · " + formatTime(message.timestamp);

    const text = document.createElement("div");
    text.className = "msg-text";
    text.textContent = message.text;

    node.append(meta, text);
    el.chatLog.appendChild(node);
  }

  // Follow the conversation, unless the reader has scrolled back to catch
  // up on something.
  if (wasAtBottom) el.chatLog.scrollTop = el.chatLog.scrollHeight;
}

function formatTime(timestamp) {
  const date = new Date(timestamp);
  return isNaN(date) ? "" : date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function renderConnection() {
  const live = snapshot !== null && Date.now() - snapshotAt < STALE_AFTER_MS;
  el.link.dataset.live = live ? "1" : "0";
  el.linkLabel.textContent = live
    ? (producerName ? "Live — " + producerName : "Live")
    : "Reconnecting…";
  // In the standard layout the role bar already says this; the lower third
  // has no chrome of its own, so it gets the badge.
  el.offline.classList.toggle("hidden", live || root.dataset.layout !== "lowerthird");
}

// The clock and the countdown both have to move between snapshots — the
// Producer pushes about once a second while a timer runs, but a paused
// browser tab, a dropped socket or a plain wall clock all need a local
// tick to stay honest.
setInterval(() => {
  if (!snapshot) return;
  if (root.dataset.layout === "lowerthird") {
    renderLowerThird();
  } else if (!el.countdown.classList.contains("hidden")) {
    el.countdown.textContent = formatDuration(remainingSeconds() || 0);
  }
  renderConnection();
}, 250);

// ---------------------------------------------------------------------
// Transport — the same `/v1/socket` push every control surface gets, with
// a REST fallback for a browser (or a proxy) that won't do WebSockets.
// ---------------------------------------------------------------------

function adopt(state) {
  snapshot = state;
  snapshotAt = Date.now();
  if (!selectedRoleId) {
    selectedRoleId = (state.roles && state.roles[0] && state.roles[0].id) || "";
  } else if (ROLE_PARAM) {
    // Resolve the parameter against real roles once they're known: an id
    // wins, then a case-insensitive name, so `?role=Host` works without
    // anyone having to know a UUID.
    const match = (state.roles || []).find(
      (r) => r.id === ROLE_PARAM ||
             r.id.toLowerCase() === ROLE_PARAM.toLowerCase() ||
             r.name.toLowerCase() === ROLE_PARAM.toLowerCase()
    );
    if (match) selectedRoleId = match.id;
  }
  render();
  renderConnection();
}

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/socket";
  let ws;
  try {
    ws = new WebSocket(url);
  } catch (_) {
    // No WebSocket in this browser (or a proxy in the way) — the heartbeat
    // above is a complete pager on its own, just a second less immediate.
    return;
  }
  socket = ws;

  ws.onopen = () => {
    reconnectDelay = 500;
  };

  ws.onmessage = (event) => {
    let payload;
    try { payload = JSON.parse(event.data); } catch (_) { return; }
    // `hello` on connect and `state` on every change carry the identical
    // shape, on purpose (see ControlAPIModels.swift) — one branch handles
    // both. A `message` event is already inside the next state snapshot.
    if (payload.event === "hello" || payload.event === "state") adopt(payload.data);
  };

  ws.onclose = () => {
    socket = null;
    renderConnection();
    // Back off to a second and stay there: a venue network that drops for
    // ten minutes should still have every pager back the moment it
    // returns, so this never gives up.
    reconnectDelay = Math.min(reconnectDelay * 2, 1000);
    setTimeout(connect, reconnectDelay);
  };

  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}

async function fetchOnce() {
  try {
    const response = await fetch("/v1/state", { cache: "no-store" });
    if (!response.ok) return;
    adopt(await response.json());
  } catch (_) {
    renderConnection();
  }
}

async function fetchProducerName() {
  try {
    const response = await fetch("/v1/health", { cache: "no-store" });
    if (!response.ok) return;
    const health = await response.json();
    producerName = health.device || "";
    renderConnection();
  } catch (_) { /* the state heartbeat is what reports the link */ }
}

// The ask, on a timer, whatever the socket is doing.
setInterval(() => {
  if (Date.now() - snapshotAt >= HEARTBEAT_MS) fetchOnce();
  if (!producerName && snapshot) fetchProducerName();
}, 1000);

// ---------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------

el.role.addEventListener("change", () => {
  selectedRoleId = el.role.value;
  storeRole(selectedRoleId);
  // A role switch changes which message is "latest" for this pager; that's
  // a view change, not a new arrival, so don't re-show a banner for it.
  const message = latestRelevantMessage();
  dismissedMessageId = message ? message.id : null;
  render();
});

// ---------------------------------------------------------------------
// Writing back
//
// The one place this pager stops being a display. Both routes are the same
// ones the app's own buttons take (`POST`/`DELETE /v1/messages` land on
// `CueEngine.sendMessage` / `clearMessageHistory`), so a message sent from a
// browser is indistinguishable from one sent on the phone pager — it
// persists, it reaches every other pager, and it comes back to this page in
// the next state push like any other.
// ---------------------------------------------------------------------

let statusTimer = null;

function showStatus(text) {
  el.composeStatus.textContent = text;
  el.composeStatus.classList.toggle("hidden", !text);
  clearTimeout(statusTimer);
  if (text) statusTimer = setTimeout(() => showStatus(""), 4000);
}

async function post(path, options) {
  const response = await fetch(path, { cache: "no-store", ...options });
  if (!response.ok) throw new Error("HTTP " + response.status);
  // The reply is the new message list, but taking the next full snapshot
  // keeps one shape in play rather than two.
  await fetchOnce();
}

function updateSendEnabled() {
  el.send.disabled = !selectedRoleId || el.composeText.value.trim() === "";
}

el.composeText.addEventListener("input", updateSendEnabled);
updateSendEnabled();

el.compose.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = el.composeText.value.trim();
  if (!text || !selectedRoleId) return;

  el.send.disabled = true;
  try {
    // This role's own thread with the Producer, addressed exactly as
    // `PagerChatView.send()` does it: a pager writes to its own DM thread,
    // never to the Everyone thread, and never picks a recipient.
    await post("/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        text,
        targetRoleId: selectedRoleId,
        senderRoleId: selectedRoleId,
      }),
    });
    el.composeText.value = "";
    updateSendEnabled();
    // This pager's own message shouldn't take its own screen over.
    const own = latestRelevantMessage();
    if (own && own.senderRoleId === selectedRoleId) dismissedMessageId = own.id;
    render();
    showStatus("Sent");
  } catch (_) {
    showStatus("Couldn't send — check the connection");
  } finally {
    el.send.disabled = false;
  }
});

/// Clearing is confirmed in the button itself rather than through
/// `window.confirm`: an embedded browser (OBS's CEF, a kiosk shell) can
/// suppress a native dialog outright, and a confirmation that silently
/// never appears is a button that silently never works.
let clearArmed = null;

el.clear.addEventListener("click", async () => {
  // History is shared: clearing it here clears it on the Producer and on
  // every other pager, so the first press only arms the button.
  if (!clearArmed) {
    el.clear.textContent = "Confirm clear?";
    showStatus("Deletes every message on every device — press again");
    clearArmed = setTimeout(disarmClear, 5000);
    return;
  }
  disarmClear();

  el.clear.disabled = true;
  try {
    await post("/v1/messages", { method: "DELETE" });
    dismissedMessageId = null;
    render();
    showStatus("History cleared");
  } catch (_) {
    showStatus("Couldn't clear — check the connection");
  } finally {
    el.clear.disabled = false;
  }
});

function disarmClear() {
  clearTimeout(clearArmed);
  clearArmed = null;
  el.clear.textContent = "Clear History";
}

el.openChat.addEventListener("click", () => {
  el.chat.classList.remove("hidden");
  el.chatLog.dataset.signature = "";
  renderChat();
  el.composeText.focus();
});

el.closeChat.addEventListener("click", () => el.chat.classList.add("hidden"));

el.chat.addEventListener("click", (event) => {
  // Click the scrim, not the card.
  if (event.target === el.chat) el.chat.classList.add("hidden");
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") el.chat.classList.add("hidden");
});

// The banner is the notification, so dismissing it here clears it
// everywhere — every web pager and every lower third — while leaving the
// thread intact. `DELETE /v1/messages` (in the chat header) is the other,
// much bigger hammer.
//
// Hidden locally first so the click feels immediate; the state that comes
// back is what actually settles it, and if the call fails the banner
// returns with the next snapshot.
el.banner.addEventListener("click", async () => {
  const message = activeNotification();
  if (!message) return;
  dismissedMessageId = message.id;
  render();
  try {
    await post("/v1/messages/dismiss", { method: "POST" });
    showStatus("Notification cleared");
  } catch (_) {
    dismissedMessageId = null;
    render();
    showStatus("Couldn't clear — check the connection");
  }
});

// One REST call up front, in parallel with the socket opening: the
// `hello` snapshot is usually faster, but on a network where the socket has
// to time out first this is the difference between a pager that paints
// immediately and one that shows placeholders for several seconds.
fetchOnce();
fetchProducerName();
connect();
</script>
</body>
</html>
