[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200

upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110

build_flags =
  -ffile-prefix-map=${platformio.packages_dir}=/pio-packages
  -ffile-prefix-map=${platformio.core_dir}=/pio-core
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D LV_CONF_INCLUDE_SIMPLE=1
  -D LV_LVGL_H_INCLUDE_SIMPLE=1
  -I include

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.3.11
  bblanchon/ArduinoJson@^7.0.4
