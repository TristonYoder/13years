name: Firmware

on:
  push:
    branches: [main]
    paths:
      - 'Hardware/esp32/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'Hardware/esp32/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and merge (env:cyd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('Hardware/esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio 'esptool~=4.11'

      - name: Build, merge and verify
        run: Hardware/esp32/tools/build-firmware.py

      - name: Check the bundled firmware is not stale
        shell: bash
        run: |
          set -euo pipefail
          BUNDLED=Sources/ProducerMac/Resources/13years-pager-merged.bin
          if [ ! -f "$BUNDLED" ]; then
            echo "::error::$BUNDLED is missing. Regenerate it with:"
            echo "  Hardware/esp32/tools/build-firmware.py --out $BUNDLED"
            exit 1
          fi
          SRC_COMMIT=$(git log -1 --format=%ct -- \
            Hardware/esp32/src Hardware/esp32/include Hardware/esp32/platformio.ini)
          BIN_COMMIT=$(git log -1 --format=%ct -- "$BUNDLED")
          if [ -z "$SRC_COMMIT" ] || [ -z "$BIN_COMMIT" ]; then
            echo "::error::Could not read git history for the firmware sources or the"
            echo "bundled image (src='$SRC_COMMIT' bin='$BIN_COMMIT'). This check needs"
            echo "fetch-depth: 0 and both paths committed."
            exit 1
          fi
          if [ "$SRC_COMMIT" -gt "$BIN_COMMIT" ]; then
            echo "::error::Firmware sources changed after the bundled image was last updated."
            echo "The app would ship flashing a stale firmware. Regenerate it with:"
            echo "  Hardware/esp32/tools/build-firmware.py --out $BUNDLED"
            exit 1
          fi
          echo "Bundled image is current with the firmware sources."

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: 13years-pager-firmware-${{ github.sha }}
          path: Hardware/esp32/.pio/build/cyd/13years-pager-merged.bin
          if-no-files-found: error
