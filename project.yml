name: ThirteenYears
options:
  bundleIdPrefix: dev.7co.13years
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "15.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ProducerMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/ProducerMac
        excludes:
          - "ProducerMac.entitlements"
          - "Resources"
      - path: Sources/ProducerMac/Resources/13years-pager-merged.bin
        buildPhase: resources
    resources:
      - path: Sources/ProducerMac/Assets.xcassets
    settings:
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
      base:
        PRODUCT_NAME: "13 Years Producer"
        PRODUCT_BUNDLE_IDENTIFIER: dev.7co.13years.producer.mac
        INFOPLIST_FILE: Sources/ProducerMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ProducerMac/ProducerMac.entitlements

  ProducerIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/ProducerIOS
    resources:
      - path: Sources/ProducerIOS/Assets.xcassets
    settings:
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "-"
      base:
        PRODUCT_NAME: "13 Years Producer"
        PRODUCT_BUNDLE_IDENTIFIER: dev.7co.13years.producer.ios
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: Sources/ProducerIOS/Info.plist

  PagerIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/PagerIOS
    resources:
      - path: Sources/PagerIOS/Assets.xcassets
    settings:
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "-"
      base:
        PRODUCT_NAME: "13 Years"
        PRODUCT_BUNDLE_IDENTIFIER: dev.7co.13years.pager
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/PagerIOS/Info.plist

  PagerTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/PagerTV
    resources:
      - path: Sources/PagerTV/Assets.xcassets
    settings:
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "-"
      base:
        PRODUCT_NAME: "13 Years TV"
        PRODUCT_BUNDLE_IDENTIFIER: dev.7co.13years.pager.tv
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: Sources/PagerTV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ThirteenYearsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Tests
      - path: Sources/ProducerMac/Flashing
      - path: Sources/ProducerMac/Resources/13years-pager-merged.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "ThirteenYearsTests"
        PRODUCT_BUNDLE_IDENTIFIER: dev.7co.13years.tests
        GENERATE_INFOPLIST_FILE: YES

  ProducerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/ProducerWatch
        excludes:
          - "ExtensionInfo.plist"
      - path: Sources/Shared/Models/CueState.swift
      - path: Sources/Shared/Models/HourFormatThreshold.swift
      - path: Sources/Shared/Models/InterTeamMessage.swift
      - path: Sources/Shared/Models/PCOTimerItem.swift
      - path: Sources/Shared/Models/RoleCue.swift
      - path: Sources/Shared/Services/API/ControlAPIModels.swift
      - path: Sources/Shared/Services/AppFonts.swift
      - path: Sources/Shared/Services/AppLog.swift
      - path: Sources/Shared/Services/PagerHaptics.swift
      - path: Sources/Shared/Views/PagerPresentationState.swift
      - path: Sources/Shared/Views/StoplightMarkView.swift
      - path: Sources/Shared/Views/Font+Inter.swift
      - path: Sources/Shared/Resources/Fonts
        buildPhase: resources
    resources:
      - path: Sources/ProducerWatch/Assets.xcassets
    settings:
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "-"
      base:
        PRODUCT_NAME: "13 Years Pager"
        PRODUCT_BUNDLE_IDENTIFIER: dev.7co.13years.pager.watch
        INFOPLIST_FILE: Sources/ProducerWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ProducerMac:
    build:
      targets:
        ProducerMac: all
    test:
      targets:
        - ThirteenYearsTests

  ProducerIOS:
    build:
      targets:
        ProducerIOS: all

  Pager:
    build:
      targets:
        PagerIOS: all

  PagerTV:
    build:
      targets:
        PagerTV: all

  PagerWatch:
    build:
      targets:
        ProducerWatch: all
